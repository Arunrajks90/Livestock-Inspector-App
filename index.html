<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Officer · Livestock Records</title>
<style>
:root{--bg:#f2fbf7;--card:#fff;--tx:#122019;--mut:#56685f;--bd:#d6e9e0;--pri:#0e9f6e;--pri2:#0d9488;--prib:#dcfaec;--wn:#b45309;--wnb:#fff3d6;--bad:#dc2626;--badb:#ffe4e4;--inf:#2563eb;--infb:#e3edff;
 --em:#10b981;--teal:#14b8a6;--blue:#2563eb;--amber:#f59e0b;--coral:#f43f5e;--violet:#8b5cf6;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header h1{font-size:17px;margin:0}
main{max-width:900px;margin:0 auto;padding:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:180px;border:0;background:none;color:var(--mut);padding:9px 4px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:600}
h2{font-size:18px;margin:18px 0 10px}h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{cursor:pointer}.stat b{font-size:28px;display:block}.stat small,.mut{color:var(--mut)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer}
.item .end{text-align:right;flex-shrink:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--infb);color:var(--inf)}
.b.ok{background:var(--prib);color:var(--pri)}.b.wn{background:var(--wnb);color:var(--wn)}.b.bad{background:var(--badb);color:var(--bad)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.dng{color:var(--bad)}.btn.sm{padding:3px 10px;font-size:13px;margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 10px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}label input,label select,label textarea{margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden],[hidden]{display:none!important}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:16px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg label{display:flex;gap:6px;align-items:center;margin:0;border:1px solid var(--bd);border-radius:9px;padding:7px 10px;color:var(--tx)}.seg input{width:auto;margin:0}
.empty{text-align:center;color:var(--mut);padding:26px}
textarea.big{min-height:180px;font:12px monospace}
body.auth{padding-bottom:16px}body.auth nav,body.auth #hb{display:none}
.auth-box{max-width:460px;margin:8px auto}.auth-box h2{margin-top:4px}.tabs{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:14px}.tabs button{flex:1;border:0;background:var(--card);color:var(--mut);padding:10px;font:inherit;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff;font-weight:600}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0 0 8px}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 4px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:99px;z-index:30;font-size:14px}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}.ck input{width:auto;margin:0}.sub{font-size:13px;color:var(--mut);margin:0 0 4px}
.free{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--prib);color:var(--pri);border:1px dashed var(--pri)}
.tgt{border-left:4px solid var(--pri)}.tgt.left{border-left-color:var(--wn)}.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}.tg3 b{display:block;font-size:24px}
fieldset.pay{border:1px solid var(--bd);border-radius:10px;padding:8px 10px 0;margin:0 0 12px}fieldset.pay legend{font-size:13px;color:var(--mut);padding:0 4px}
a.btn{text-decoration:none;display:inline-block}.btn.wa{color:#128c4a;border-color:#128c4a66}
.sum{display:flex;gap:10px;flex-wrap:wrap}.sum .card{flex:1;min-width:140px;margin:0}.sum b{font-size:22px;display:block}
.grp{margin:16px 0 6px}

/* ===== bright theme ===== */
body{background:linear-gradient(180deg,#e9fbf3 0,#f3f9ff 420px,#f7fbfa 100%) fixed;font-size:15.5px}
body::before{background:linear-gradient(90deg,#0e9f6e,#0d9488)}
header{background:linear-gradient(100deg,#0e9f6e 0%,#0d9488 55%,#2563eb 130%);border:0;box-shadow:0 4px 16px #0d948833;color:#fff}
header h1{font-size:18px;letter-spacing:.2px}
header .btn{background:#ffffff26;border-color:#ffffff66;color:#fff;font-weight:600}
nav{background:#fff;border-top:0;box-shadow:0 -4px 18px #0f3d2a14}
nav button{color:#6b7c74}nav button.on{color:var(--pri)}nav button.on span{background:var(--prib);border-radius:12px}
nav button span{padding:2px 0;transition:.15s}
h2{color:#0f3d2a}
.card{border:1px solid var(--bd);border-radius:14px;box-shadow:0 2px 8px #0f3d2a0d}
.btn{border-radius:10px;font-weight:500;transition:transform .08s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 3px 10px #0d948840}
.btn.dng{color:var(--bad);border-color:#fecaca}
.btn.wa{color:#0a7f3f;border-color:#25d36688;background:#effdf4}
input,select,textarea{background:#fff;border-color:#cfe3da}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #14b8a633}
.b{font-weight:700;border:1px solid transparent}
.b{background:var(--infb);color:var(--inf);border-color:#bfd3ff}
.b.ok{background:#dcfce7;color:#047857;border-color:#a7f3d0}
.b.wn{background:#fff3d6;color:#b45309;border-color:#fcd34d}
.b.bad{background:#ffe4e4;color:#c81e1e;border-color:#fca5a5}
.free{background:#e3edff;color:#1d4ed8;border:1px dashed #2563eb}
.chip{border-color:#cfe3da;background:#fff}
.chip.on{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;color:#fff;font-weight:600}
.sheet{border-top:5px solid var(--teal)}
.sheet h3{color:#0f3d2a}
fieldset.pay{border-color:#fcd34d;background:#fffbeb}
/* module colours: Treatment coral, AI blue, PD teal, Feed amber */
.btn[data-a=qT],.btn[data-a=addT]{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff;border-color:transparent;box-shadow:0 3px 10px #f43f5e40}
.btn[data-a=qAI],.btn[data-a=addAI]{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent;box-shadow:0 3px 10px #2563eb40}
.btn[data-a=qPD],.btn[data-a=pdr].pri{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;border-color:transparent;box-shadow:0 3px 10px #0d948840}
.btn[data-a=qFD],.btn[data-a=addF]{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border-color:transparent;box-shadow:0 3px 10px #f9731640}
.btn[data-a=reAI]{background:linear-gradient(135deg,#fb923c,#f97316);color:#fff;border-color:transparent}
.btn[data-a=wtV]{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#422006;border-color:transparent}
.btn[data-a=addC],.btn[data-a=addA]{border-color:#a7f3d0;color:#047857;background:#f0fdf8;font-weight:600}
/* dashboard summary cards */
.grid .stat{position:relative;overflow:hidden;border:0;color:#0f2a20}
.grid .stat b{font-size:30px}
.grid .stat:nth-child(1){background:linear-gradient(135deg,#e0ecff,#f5f9ff);box-shadow:inset 4px 0 #2563eb,0 2px 8px #2563eb1a}.grid .stat:nth-child(1) b{color:#1d4ed8}
.grid .stat:nth-child(2){background:linear-gradient(135deg,#d9fbea,#f4fffa);box-shadow:inset 4px 0 #10b981,0 2px 8px #10b9811a}.grid .stat:nth-child(2) b{color:#047857}
.grid .stat:nth-child(3){background:linear-gradient(135deg,#d5f8f3,#f2fffd);box-shadow:inset 4px 0 #14b8a6,0 2px 8px #14b8a61a}.grid .stat:nth-child(3) b{color:#0f766e}
.grid .stat:nth-child(4){background:linear-gradient(135deg,#ffefd2,#fffaf0);box-shadow:inset 4px 0 #f59e0b,0 2px 8px #f59e0b1a}.grid .stat:nth-child(4) b{color:#b45309}
.grid .stat:nth-child(5){background:linear-gradient(135deg,#ffe1e6,#fff6f7);box-shadow:inset 4px 0 #f43f5e,0 2px 8px #f43f5e1a}.grid .stat:nth-child(5) b{color:#be123c}
.grid .stat small{color:#4b5d55}
/* AI target */
.tgt{border:0;background:linear-gradient(120deg,#dcfce7,#ecfeff);box-shadow:inset 5px 0 #10b981,0 2px 8px #10b9811a}
.tgt.left{background:linear-gradient(120deg,#fff3d6,#fff9ef);box-shadow:inset 5px 0 #f59e0b,0 2px 8px #f59e0b1a}
.bar{background:#e2ece8;height:12px}.bar i{background:linear-gradient(90deg,#10b981,#14b8a6,#2563eb)}
.tg3>div{background:#f6faf8;border-radius:10px;padding:6px 2px}
.sum .card:first-child{background:linear-gradient(135deg,#ffe4e4,#fff7f7);border-color:#fecaca}
.sum .card:last-child{background:linear-gradient(135deg,#dcfce7,#f4fffa);border-color:#a7f3d0}
/* reminder rows: coloured edge by type */
.rk-tr{box-shadow:inset 4px 0 #f43f5e,0 2px 8px #0f3d2a0d}
.rk-ai{box-shadow:inset 4px 0 #2563eb,0 2px 8px #0f3d2a0d}
.rk-pd{box-shadow:inset 4px 0 #14b8a6,0 2px 8px #0f3d2a0d}
.rk-rai{box-shadow:inset 4px 0 #f97316,0 2px 8px #0f3d2a0d}
.rk-pg{box-shadow:inset 4px 0 #8b5cf6,0 2px 8px #0f3d2a0d}
.rk-wt{box-shadow:inset 4px 0 #f59e0b,0 2px 8px #0f3d2a0d}
.tabs button.on{background:linear-gradient(135deg,#10b981,#0d9488)}
.toast{background:#0f3d2a;color:#fff}
a{color:var(--pri)}
</style>
</head>
<body>
<header><h1>🐄 Field Officer</h1><div id="hb" class="btns" style="margin:0"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="ov" id="m" hidden></div>
<script>
const K='lvi_field_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ld=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ld(new Date());
const add=(s,n)=>{const x=P(s);x.setDate(x.getDate()+n);return ld(x)};
const dd=s=>Math.round((P(s)-P(today()))/864e5);
const fmt=s=>s?P(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const rel=s=>{const n=dd(s);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>0?'in '+n+' days':-n+' days overdue'};
const b=(t,c='')=>`<span class="b ${c}">${t}</span>`;
const due=s=>{const n=dd(s);return b(rel(s),n<0?'bad':n<=2?'wn':'')};
const SP=['Cow','Buffalo','Goat','Sheep','Pig','Dog','Cat','Poultry','Horse'];
const EM={Cow:'🐄',Buffalo:'🐃',Goat:'🐐',Sheep:'🐑',Pig:'🐖',Dog:'🐕',Cat:'🐈',Poultry:'🐔',Horse:'🐎'};
const emo=s=>EM[s]||'🐾';
let S,ui={tab:'dash',d:null,hist:[],q:'',sp:'',st:'active',r:'week',t:'all',ps:'Pending',pt:'all',auth:'login'},pend=null;

/* starts empty for a real user; reference lists (SP, EM, PM) are kept above and below */
function seed(){return{cs:[],an:[],tr:[],ai:[],fd:[]}}
/* ---------- accounts (stored on this device) ---------- */
/* Login / Sign Up is OFF for now: the app opens straight into the last-used account (or a test account). Set to true to bring login back. */
const AUTH_ON=false;
const UK='lvi_users',SK='lvi_session',TK='lvi_test_user';let U=null;
const testUser=()=>{let u=null;try{u=JSON.parse(localStorage.getItem(TK))}catch(e){}return u&&u.id==='test'?u:{id:'test',name:'Test Inspector',hosp:'Test Veterinary Centre',qual:'',age:'',gender:'',phone:'',email:'',area:'',created:today()}};
const users=()=>{try{return JSON.parse(localStorage.getItem(UK))||[]}catch(e){return[]}};
const saveUsers=L=>{try{localStorage.setItem(UK,JSON.stringify(L))}catch(e){}};
const dk=()=>K+'_u_'+U.id;
const ph10=p=>String(p||'').replace(/\D/g,'').slice(-10);
async function hash(pw,salt){const t=salt+'|'+pw;try{const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h1=5381,h2=52711;for(const c of t){const k=c.charCodeAt(0);h1=(h1*33^k)>>>0;h2=(h2*31+k)>>>0}return 'f'+h1.toString(16)+h2.toString(16)}}
const CLK='lvi_claimed',FLDS=['cs','an','tr','ai','fd'];
/* records saved on this device without an account (old single-user data + login-off test data). Never deleted. */
function unclaimed(){try{if(localStorage.getItem(CLK))return null}catch(e){return null}const o={cs:[],an:[],tr:[],ai:[],fd:[]};
 [K,K+'_u_test'].forEach(k=>{try{const x=JSON.parse(localStorage.getItem(k));if(x&&x.cs){FLDS.forEach(f=>o[f].push(...(x[f]||[])));if(x.aiTarget)o.aiTarget=x.aiTarget;if(x.sig)o.sig=x.sig}}catch(e){}});
 const n=FLDS.reduce((t,f)=>t+o[f].length,0);return n?o:null}
const ucText=o=>`${o.cs.length} farmer${o.cs.length===1?'':'s'}, ${o.an.length} animal${o.an.length===1?'':'s'}, ${o.tr.length} treatment${o.tr.length===1?'':'s'}, ${o.ai.length} AI/PD record${o.ai.length===1?'':'s'}, ${o.fd.length} feed suppl${o.fd.length===1?'y':'ies'}`;
/* merge unclaimed records into the logged-in account (skips ids it already has); originals stay on the device */
function claim(){const o=unclaimed();if(!o||!U)return 0;FLDS.forEach(f=>{S[f]=S[f]||[];const have=new Set(S[f].map(x=>x.id));o[f].forEach(x=>{if(!have.has(x.id)){S[f].push(x);have.add(x.id)}})});
 if(o.aiTarget&&!S.aiTarget)S.aiTarget=o.aiTarget;if(o.sig&&!S.sig)S.sig=o.sig;save();try{localStorage.setItem(CLK,U.id+' '+new Date().toISOString())}catch(e){}return 1}
function load(){S=null;try{S=JSON.parse(localStorage.getItem(dk()))}catch(e){}if(!S||!S.cs)S=seed();S.fd=S.fd||[];
 /* sample data is added once per account; after you remove it, it does not come back */
 if(!S.demoSeen){S.demoSeen=true;if(!hasDemo())addSamples();else save()}}
function save(){if(!U)return;try{localStorage.setItem(dk(),JSON.stringify(S))}catch(e){}}
function login(u){U=u;try{localStorage.setItem(SK,u.id);localStorage.setItem('lvi_last',u.id)}catch(e){}load();ui.tab='dash';ui.d=null;ui.hist=[];ui.q='';closeM();scrollTo(0,0);render()}
function logout(){try{localStorage.removeItem(SK)}catch(e){}U=null;S=null;ui.auth='login';closeM();render()}
const QUAL=['B.V.Sc & A.H.','M.V.Sc','Ph.D (Veterinary)','Diploma in Livestock Management','Livestock Inspector Certificate','Diploma in Dairy Technology','Other'];
const sel=(l,n,opts,v,x='')=>`<label>${l}<select name="${n}" ${x}>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
const profFields=(u={})=>fl('Full name *','name',u.name,'text','required autocomplete="name"')+fl('Veterinary hospital / centre name *','hosp',u.hosp,'text','required')
 +`<label>Qualification *<input name="qual" list="qlist" value="${esc(u.qual)}" required><datalist id="qlist">${QUAL.map(q=>`<option value="${esc(q)}">`).join('')}</datalist></label>`
 +`<div class="two">${fl('Age *','age',u.age,'number','required min="18" max="90" inputmode="numeric"')}${sel('Gender *','gender',['Male','Female','Other'],u.gender)}</div>`
 +fl('Phone number *','phone',u.phone,'tel','required inputmode="tel" autocomplete="tel"')+fl('Email ID *','email',u.email,'email','required autocomplete="email"')
 +fl('Area / Panchayat *','area',u.area,'text','required');
/* returns an error message, or '' if the profile is valid and unique */
function profCheck(d,selfId){if(ph10(d.phone).length!==10)return 'Enter a valid 10-digit phone number.';
 const L=users().filter(u=>u.id!==selfId);if(L.some(u=>u.email===d.email.trim().toLowerCase()))return 'An account with this email already exists.';
 if(L.some(u=>u.phone===ph10(d.phone)))return 'An account with this phone number already exists.';return ''}
const profObj=d=>({name:d.name.trim(),hosp:d.hosp.trim(),qual:d.qual.trim(),age:d.age,gender:d.gender,phone:ph10(d.phone),email:d.email.trim().toLowerCase(),area:d.area.trim()});
function authView(){const su=ui.auth==='signup',uc=unclaimed(),tp=(()=>{try{const t=JSON.parse(localStorage.getItem(TK));if(t&&t.id==='test'){const{id,created,...r}=t;return r}}catch(e){}return{}})();
 return `<div class="auth-box"><div class="card" style="text-align:center;padding:18px"><div style="font-size:40px">🐄</div><h2 style="margin:4px 0">Livestock Inspector</h2><div class="mut">Farmers, animals, treatment, AI, PD and payments</div></div>
 <div class="card"><div class="tabs"><button class="${su?'':'on'}" data-a="auth" data-id="login">Login</button><button class="${su?'on':''}" data-a="auth" data-id="signup">Sign up</button></div>
 ${su?`<form data-auth="signup">${profFields(tp)}<div class="two">${fl('Password / PIN *','pw','','password','required minlength="4" autocomplete="new-password"')}${fl('Confirm *','pw2','','password','required minlength="4" autocomplete="new-password"')}</div>${uc?`<label class="seg" style="margin-bottom:12px;border-color:var(--pri)"><span style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="legacy" value="1" checked style="width:auto;margin-top:3px"><span style="color:var(--tx)"><b>Keep existing records</b> already saved on this device: ${ucText(uc)}. They will be added to this account.</span></span></label>`:''}<p class="err"></p><button class="btn pri" style="width:100%">Create account</button></form>`
 :`<form data-auth="login">${fl('Email ID or phone number','id','','text','required autocomplete="username"')}${fl('Password / PIN','pw','','password','required autocomplete="current-password"')}<p class="err"></p><button class="btn pri" style="width:100%">Login</button><p class="mut" style="text-align:center;margin:12px 0 0">New inspector? <a href="#" data-a="auth" data-id="signup" style="color:var(--pri)">Create an account</a></p></form>`}

 modal((ed?'Edit feed supply':'🌾 Feed supply')+who(aid),`<p style="margin-top:0">${FREE} <span class="mut">No payment is collected for feed supply or weight checks.</span></p>${pendNote(aid,1)}
 ${fl('Feed supplied date *','date',r.date||today(),'date','required')}
 <label>Feed type / details *<input name="feed" list="feedl" value="${esc(r.feed)}" required placeholder="Calf feed, mineral mixture…"><datalist id="feedl">${FEEDS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></label>
 <div class="two">${fl('Quantity (bags / kg)','qty',r.qty,'text','placeholder="e.g. 2 bags (50 kg)"')}${fl('Weight on supply day (kg, optional)','bw',r.bw,'number','min="0" step="0.1" inputmode="decimal"')}</div>
 ${ta('Remarks / description','notes',r.notes)}
 ${fl('3-month weight check date','wDate',r.wDate||addM(r.date||today(),3),'date','required')}<p class="mut" id="wh" style="margin-top:-6px;font-size:13px"></p>`,
 d=>{const o=ed?r:{id:uid(),aid,cid:A(aid)?.cid,checks:[]};if(ed&&d.wDate!==r.wDate)o.wDone=false;['date','feed','qty','bw','notes','wDate'].forEach(k=>o[k]=d[k].trim?d[k].trim():d[k]);if(!ed)S.fd.push(o)},
 f=>{const w=f.wDate,h=f.querySelector('#wh');if(ed)w.dataset.t=1;const u=()=>{h.textContent=w.dataset.t?'Set manually.':'Auto: 3 months after the feed supplied date. You can change it.'};
  f.date.addEventListener('change',()=>{if(!w.dataset.t&&f.date.value)w.value=addM(f.date.value,3);u()});w.addEventListener('input',()=>{w.dataset.t=1;u()});u()})}
function wtForm(id){const r=FD(id),last=(r.checks||[]).slice(-1)[0];
 modal('⚖️ Weight verification'+who(r.aid),`<p class="mut" style="margin-top:0">🌾 Feed supplied ${fmt(r.date)} · ${esc(r.feed)}${r.qty?' · '+esc(r.qty):''}<br>3-month check due ${fmt(r.wDate)} · ${FREE}${last?`<br>Last weight ${kg(last.kg)} on ${fmt(last.date)}`:r.bw?`<br>Weight at supply ${kg(r.bw)}`:''}</p>
 ${fl('Weight check date *','date',today(),'date','required max="'+today()+'"')}${fl('Recorded weight (kg) *','kg','','number','required min="0" step="0.1" inputmode="decimal"')}<p class="mut" id="gr" style="margin-top:-6px;font-size:13px"></p>
 ${ta('Description / remarks (growth status, observations)','note','')}
 <label class="ck"><input type="checkbox" name="again" value="1"> Schedule another 3-month weight check</label><div id="ag">${fl('Next weight check date','nd',addM(today(),3),'date')}</div>`,
 d=>{(r.checks=r.checks||[]).push({date:d.date,kg:d.kg,note:d.note.trim()});if(d.again&&d.nd){r.wDate=d.nd;r.wDone=false}else r.wDone=true},
 f=>{const base=+(last?last.kg:r.bw)||0,u=()=>{f.querySelector('#ag').hidden=!f.again.checked;const v=+f.kg.value;f.querySelector('#gr').textContent=base&&v?`Change: ${v-base>=0?'+':''}${kg(v-base)} since ${last?'last check':'feed supply'}`:'';if(!f.nd.dataset.t&&f.date.value)f.nd.value=addM(f.date.value,3)};
  f.nd.addEventListener('input',()=>f.nd.dataset.t=1);f.addEventListener('input',u);f.addEventListener('change',u);u()})}
function deathForm(id){const a=A(id);modal('Record death',fl('Date of death','date',today(),'date','required max="'+today()+'"')+fl('Cause / reason','cause')+ta('Notes','notes'),d=>{a.status='dead';a.sdate=d.date;a.snote=[d.cause,d.notes].filter(Boolean).join(' · ');logH(a,'Died'+(d.cause?' — '+d.cause:''),d.date)})}
function sellForm(id){const a=A(id),others=S.cs.filter(c=>c.id!==a.cid);
 modal('Sell animal',fl('Sale date','date',today(),'date','required')+`<label>Buyer<select name="buyer"><option value="">Not in database (type details below)</option>${others.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.village)} (registered)</option>`).join('')}</select></label><div id="bn">${fl('Buyer name / details','bname')}</div>`+fl('Sale price (₹)','price','','number','min="0"')+ta('Notes','notes'),
 d=>{const to=d.buyer&&C(d.buyer),from=C(a.cid),pr=d.price?' for ₹'+d.price:'';
  if(to){logH(a,`Sold by ${from.name} to ${to.name}${pr}`,d.date);a.cid=to.id}
  else{a.status='sold';a.sdate=d.date;a.snote=[d.bname&&'Buyer: '+d.bname,d.price&&'₹'+d.price,d.notes].filter(Boolean).join(' · ');logH(a,'Sold to '+(d.bname||'outside buyer')+pr,d.date)}},
 f=>{const u=()=>f.querySelector('#bn').hidden=!!f.buyer.value;f.addEventListener('change',u);u()})}
function xferForm(id){const a=A(id),others=S.cs.filter(c=>c.id!==a.cid);
 if(!others.length)return ask('Transfer needs another registered farmer. Add the receiving farmer first.',()=>{});
 modal('Transfer to another farmer',`<p class="mut">Current owner: ${esc(C(a.cid).name)}. Treatment records and follow-ups move with the animal.</p><label>New owner *<select name="to">${others.map(c=>`<option value="${c.id}">${esc(c.name)} · ${esc(c.village)}</option>`).join('')}</select></label>`+fl('Transfer date','date',today(),'date','required')+ta('Reason / notes','notes'),
 d=>{const to=C(d.to),from=C(a.cid);logH(a,`Transferred from ${from.name} to ${to.name}`+(d.notes?' — '+d.notes:''),d.date);a.cid=to.id})}
function tools(){modal('Data tools',`${fl('Sign-off for WhatsApp / SMS messages','sig',S.sig||'','text','placeholder="'+esc(U.name+(U.hosp?', '+U.hosp:''))+'"')}<p class="mut">Your records are saved in this browser, under your account. Copy the JSON below to back it up, or paste a backup and press Import.</p><textarea class="big" id="j" name="j"></textarea><div class="btns"><button type="button" class="btn" data-a="exp">Show export</button><button type="button" class="btn" data-a="imp">Import pasted</button>${hasDemo()?'<button type="button" class="btn" data-a="demoX">🧪 Remove sample data</button>':'<button type="button" class="btn" data-a="demoL">🧪 Load sample data</button>'}<button type="button" class="btn dng" data-a="clr">Delete all my records</button></div>`,d=>{S.sig=(d.sig||'').trim()})}

/* ---------- actions ---------- */
function open(k,id){if(ui.d)ui.hist.push(ui.d);ui.d={k,id};scrollTo(0,0)}
function act(a,id,k){const rec=(arr)=>arr.find(x=>x.id===id);
 const del=(msg,fn)=>ask(msg,()=>{fn();ui.d=ui.d&&((ui.d.k==='a'&&!A(ui.d.id))||(ui.d.k==='c'&&!C(ui.d.id))||(ui.d.k==='p'&&!S.ai.find(x=>x.id===ui.d.id)))?ui.hist.pop()||null:ui.d;save();render()});
 switch(a){
 case'tab':ui.tab=id;ui.d=null;ui.hist=[];ui.q='';ui.sp='';scrollTo(0,0);return render();
 case'open':ui.d&&(ui.d.k===k&&ui.d.id===id)||open(k,id);return render();
 case'back':ui.d=ui.hist.pop()||null;return render();
 case'close':return closeM();
 case'yes':{const f=pend;closeM();return f&&f()}
 case'sp':ui.sp=id;return render();
 case'flt':ui[k]=id;return render();
 case'addC':return custForm();case'editC':return custForm(C(id));
 case'delC':return del('Delete this farmer and all their animals and records?',()=>{ownAll(id).forEach(x=>cascade(x.id));S.cs=S.cs.filter(x=>x.id!==id)});
 case'addA':return aniForm({},id);case'editA':return aniForm(A(id));
 case'delA':return del('Delete this animal and all its records?',()=>cascade(id));
 case'addT':return trForm({},id);case'editT':return trForm(rec(S.tr));
 case'delT':return del('Delete this treatment record?',()=>S.tr=S.tr.filter(x=>x.id!==id));
 case'addAI':return aiForm({},id);case'editAI':return aiForm(rec(S.ai));
 case'delAI':return del('Delete this AI record?',()=>S.ai=S.ai.filter(x=>x.id!==id));
 case'pdr':return pdForm(id);
 case'reAI':{const r=rec(S.ai);return aiForm({semen:r.semen},r.aid,r.id)}
 case'raiS':return raiForm(id);
 case'pgAuto':{const f=$('#pgf');f.due.value=id;return pgUpd()}
 case'trkT':ui.tab='trk';ui.d=null;ui.hist=[];ui.q='';ui.t=id;ui.r=id==='all'?'week':'all';scrollTo(0,0);return render();
 case'paid':return paidForm(k,id);
 case'paidF':{const c=flowCid;return paidForm(k,id,()=>pickAnimalOf(c))}
 case'openC':closeM();ui.d&&(ui.d.k==='c'&&ui.d.id===id)||open('c',id);return render();
 case'done':{const r=k==='tr'?rec(S.tr):rec(S.ai);if(k==='tr')r.done=true;else if(k==='ai')r.nextDone=true;else if(k==='due')r.dueDone=true;else r.fDone=true;save();return render()}
 case'qT':return pickFarmer('T');
 case'qAI':return pickFarmer('AI');
 case'qPD':return pickFarmer('PD');
 case'qFD':return pickFarmer('FD');
 case'tgtE':return tgtForm();
 case'demoL':closeM();addSamples();ui.d=null;ui.tab='dash';render();return toast('Sample data loaded');
 case'demoX':return ask('Remove the sample farmer, animals and all their records (including anything you added to them while testing)? Your real records are not touched.',()=>{removeSamples();ui.d=null;ui.hist=[];render();toast('Sample data removed')});
 case'addF':return fdForm({},id);case'editF':return fdForm(FD(id));
 case'delF':return del('Delete this feed supply record and its weight checks?',()=>S.fd=S.fd.filter(x=>x.id!==id));
 case'wtV':return wtForm(id);
 case'wtN':{const r=FD(id);r.wDate=addM(today(),3);r.wDone=false;save();render();return fdForm(r)}
 case'flB':return pickFarmer();
 case'flF':return pickAnimalOf(id);
 case'flA':return FLOW[flow].go(id);
 case'dead':return deathForm(id);case'sell':return sellForm(id);case'xfer':return xferForm(id);
 case'reinst':return ask('Mark this animal as active again?',()=>{const a=A(id);a.status='active';a.sdate='';a.snote='';logH(a,'Reinstated',today());save();render()});
 case'ast':ui.st=id;return render();
 case'tools':return tools();
 case'auth':ui.auth=id;return render();
 case'prof':return profile();case'profE':return profEdit();case'profP':return pwForm();
 case'logout':return ask('Log out of this device?',logout);
 case'exp':$('#j').value=JSON.stringify(S,null,1);$('#j').select();return;
 case'imp':try{const x=JSON.parse($('#j').value);if(!x.cs||!x.an||!x.tr||!x.ai)throw 0;x.fd=x.fd||[];S=x;save();closeM();ui.d=null;return render()}catch(e){$('#j').value='Invalid backup JSON.';return}
 case'clr':return ask('Delete all your farmers, animals and records? This cannot be undone.',()=>{S={cs:[],an:[],tr:[],ai:[],fd:[]};save();ui.d=null;ui.hist=[];render()})}}
function cascade(id){S.an=S.an.filter(x=>x.id!==id);S.tr=S.tr.filter(x=>x.aid!==id);S.ai=S.ai.filter(x=>x.aid!==id);S.fd=S.fd.filter(x=>x.aid!==id)}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();act(t.dataset.a,t.dataset.id,t.dataset.k)});
document.addEventListener('input',e=>{if(e.target.id==='flq'){$('#fll').innerHTML=flowFarmers(e.target.value);return}if(e.target.id==='q'){ui.q=e.target.value;$('#list').innerHTML=ui.tab==='cust'?custList():ui.tab==='pay'?payList():aniList()}});
{const sid=(()=>{try{return localStorage.getItem(SK)}catch(e){}})();U=users().find(u=>u.id===sid)||null;if(!U&&!AUTH_ON){const L=users(),last=(()=>{try{return localStorage.getItem('lvi_last')}catch(e){}})();U=L.find(u=>u.id===last)||L[L.length-1]||testUser()}if(U)load();if(!users().length)ui.auth='signup'}
render();
</script>
</body>
