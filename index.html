<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Livestock Inspector records: farmers, animals, treatment, AI, PD checks, feed supply, reminders and payments.">
<meta name="theme-color" content="#0d9488">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Field Officer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Field Officer · Livestock Records</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<style>
:root{--bg:#f2fbf7;--card:#fff;--tx:#122019;--mut:#56685f;--bd:#d6e9e0;--pri:#0e9f6e;--pri2:#0d9488;--prib:#dcfaec;--wn:#b45309;--wnb:#fff3d6;--bad:#dc2626;--badb:#ffe4e4;--inf:#2563eb;--infb:#e3edff;
 --em:#10b981;--teal:#14b8a6;--blue:#2563eb;--amber:#f59e0b;--coral:#f43f5e;--violet:#8b5cf6;color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
header h1{font-size:17px;margin:0}
main{max-width:900px;margin:0 auto;padding:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:180px;border:0;background:none;color:var(--mut);padding:9px 4px;font:inherit;font-size:12px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--pri);font-weight:600}
h2{font-size:18px;margin:18px 0 10px}h3{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{cursor:pointer}.stat b{font-size:28px;display:block}.stat small,.mut{color:var(--mut)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer}
.item .end{text-align:right;flex-shrink:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.b{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--infb);color:var(--inf)}
.b.ok{background:var(--prib);color:var(--pri)}.b.wn{background:var(--wnb);color:var(--wn)}.b.bad{background:var(--badb);color:var(--bad)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 14px;font:inherit;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.dng{color:var(--bad)}.btn.sm{padding:3px 10px;font-size:13px;margin-top:4px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 10px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mut)}label input,label select,label textarea{margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden],[hidden]{display:none!important}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:16px}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.seg label{display:flex;gap:6px;align-items:center;margin:0;border:1px solid var(--bd);border-radius:9px;padding:7px 10px;color:var(--tx)}.seg input{width:auto;margin:0}
.empty{text-align:center;color:var(--mut);padding:26px}
textarea.big{min-height:180px;font:12px monospace}
body.auth{padding-bottom:16px}body.auth nav,body.auth #hb{display:none}
.auth-box{max-width:460px;margin:8px auto}.auth-box h2{margin-top:4px}.tabs{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;margin-bottom:14px}.tabs button{flex:1;border:0;background:var(--card);color:var(--mut);padding:10px;font:inherit;cursor:pointer}.tabs button.on{background:var(--pri);color:#fff;font-weight:600}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0 0 8px}.err.show{background:var(--badb);border:1px solid #fca5a5;border-radius:10px;padding:8px 10px;font-weight:600}.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 4px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:99px;z-index:30;font-size:14px}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}.ck input{width:auto;margin:0}.sub{font-size:13px;color:var(--mut);margin:0 0 4px}
.free{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--prib);color:var(--pri);border:1px dashed var(--pri)}
.tgt{border-left:4px solid var(--pri)}.tgt.left{border-left-color:var(--wn)}.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:8px}.tg3 b{display:block;font-size:24px}
fieldset.pay{border:1px solid var(--bd);border-radius:10px;padding:8px 10px 0;margin:0 0 12px}fieldset.pay legend{font-size:13px;color:var(--mut);padding:0 4px}
a.btn{text-decoration:none;display:inline-block}.btn.wa{color:#128c4a;border-color:#128c4a66}
.sum{display:flex;gap:10px;flex-wrap:wrap}.sum .card{flex:1;min-width:140px;margin:0}.sum b{font-size:22px;display:block}
.grp{margin:16px 0 6px}

/* ===== bright theme ===== */
body{background:linear-gradient(180deg,#e9fbf3 0,#f3f9ff 420px,#f7fbfa 100%) fixed;font-size:15.5px}
body::before{background:linear-gradient(90deg,#0e9f6e,#0d9488)}
header{background:linear-gradient(100deg,#0e9f6e 0%,#0d9488 55%,#2563eb 130%);border:0;box-shadow:0 4px 16px #0d948833;color:#fff}
header h1{font-size:18px;letter-spacing:.2px}
header .btn{background:#ffffff26;border-color:#ffffff66;color:#fff;font-weight:600}
nav{background:#fff;border-top:0;box-shadow:0 -4px 18px #0f3d2a14}
nav button{color:#6b7c74}nav button.on{color:var(--pri)}nav button.on span{background:var(--prib);border-radius:12px}
nav button span{padding:2px 0;transition:.15s}
h2{color:#0f3d2a}
.card{border:1px solid var(--bd);border-radius:14px;box-shadow:0 2px 8px #0f3d2a0d}
.btn{border-radius:10px;font-weight:500;transition:transform .08s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 3px 10px #0d948840}
.btn.dng{color:var(--bad);border-color:#fecaca}
.btn.wa{color:#0a7f3f;border-color:#25d36688;background:#effdf4}
input,select,textarea{background:#fff;border-color:#cfe3da}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #14b8a633}
.b{font-weight:700;border:1px solid transparent}
.b{background:var(--infb);color:var(--inf);border-color:#bfd3ff}
.b.ok{background:#dcfce7;color:#047857;border-color:#a7f3d0}
.b.wn{background:#fff3d6;color:#b45309;border-color:#fcd34d}
.b.bad{background:#ffe4e4;color:#c81e1e;border-color:#fca5a5}
.free{background:#e3edff;color:#1d4ed8;border:1px dashed #2563eb}
.chip{border-color:#cfe3da;background:#fff}
.chip.on{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;color:#fff;font-weight:600}
.sheet{border-top:5px solid var(--teal)}
.sheet h3{color:#0f3d2a}
fieldset.pay{border-color:#fcd34d;background:#fffbeb}
/* module colours: Treatment coral, AI blue, PD teal, Feed amber */
.btn[data-a=qT],.btn[data-a=addT]{background:linear-gradient(135deg,#fb7185,#f43f5e);color:#fff;border-color:transparent;box-shadow:0 3px 10px #f43f5e40}
.btn[data-a=qAI],.btn[data-a=addAI]{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:transparent;box-shadow:0 3px 10px #2563eb40}
.btn[data-a=qPD],.btn[data-a=pdr].pri{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;border-color:transparent;box-shadow:0 3px 10px #0d948840}
.btn[data-a=qFD],.btn[data-a=addF]{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border-color:transparent;box-shadow:0 3px 10px #f9731640}
.btn[data-a=reAI]{background:linear-gradient(135deg,#fb923c,#f97316);color:#fff;border-color:transparent}
.btn[data-a=wtV]{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#422006;border-color:transparent}
.btn[data-a=addC],.btn[data-a=addA]{border-color:#a7f3d0;color:#047857;background:#f0fdf8;font-weight:600}
/* dashboard summary cards */
.grid .stat{position:relative;overflow:hidden;border:0;color:#0f2a20}
.grid .stat b{font-size:30px}
.grid .stat:nth-child(1){background:linear-gradient(135deg,#e0ecff,#f5f9ff);box-shadow:inset 4px 0 #2563eb,0 2px 8px #2563eb1a}.grid .stat:nth-child(1) b{color:#1d4ed8}
.grid .stat:nth-child(2){background:linear-gradient(135deg,#d9fbea,#f4fffa);box-shadow:inset 4px 0 #10b981,0 2px 8px #10b9811a}.grid .stat:nth-child(2) b{color:#047857}
.grid .stat:nth-child(3){background:linear-gradient(135deg,#d5f8f3,#f2fffd);box-shadow:inset 4px 0 #14b8a6,0 2px 8px #14b8a61a}.grid .stat:nth-child(3) b{color:#0f766e}
.grid .stat:nth-child(4){background:linear-gradient(135deg,#ffefd2,#fffaf0);box-shadow:inset 4px 0 #f59e0b,0 2px 8px #f59e0b1a}.grid .stat:nth-child(4) b{color:#b45309}
.grid .stat:nth-child(5){background:linear-gradient(135deg,#ffe1e6,#fff6f7);box-shadow:inset 4px 0 #f43f5e,0 2px 8px #f43f5e1a}.grid .stat:nth-child(5) b{color:#be123c}
.grid .stat small{color:#4b5d55}
/* AI target */
.tgt{border:0;background:linear-gradient(120deg,#dcfce7,#ecfeff);box-shadow:inset 5px 0 #10b981,0 2px 8px #10b9811a}
.tgt.left{background:linear-gradient(120deg,#fff3d6,#fff9ef);box-shadow:inset 5px 0 #f59e0b,0 2px 8px #f59e0b1a}
.bar{background:#e2ece8;height:12px}.bar i{background:linear-gradient(90deg,#10b981,#14b8a6,#2563eb)}
.tg3>div{background:#f6faf8;border-radius:10px;padding:6px 2px}
.sum .card:first-child{background:linear-gradient(135deg,#ffe4e4,#fff7f7);border-color:#fecaca}
.sum .card:last-child{background:linear-gradient(135deg,#dcfce7,#f4fffa);border-color:#a7f3d0}
/* reminder rows: coloured edge by type */
.rk-tr{box-shadow:inset 4px 0 #f43f5e,0 2px 8px #0f3d2a0d}
.rk-ai{box-shadow:inset 4px 0 #2563eb,0 2px 8px #0f3d2a0d}
.rk-pd{box-shadow:inset 4px 0 #14b8a6,0 2px 8px #0f3d2a0d}
.rk-rai{box-shadow:inset 4px 0 #f97316,0 2px 8px #0f3d2a0d}
.rk-pg{box-shadow:inset 4px 0 #8b5cf6,0 2px 8px #0f3d2a0d}
.rk-wt{box-shadow:inset 4px 0 #f59e0b,0 2px 8px #0f3d2a0d}
.tabs button.on{background:linear-gradient(135deg,#10b981,#0d9488)}
.toast{background:#0f3d2a;color:#fff}
a{color:var(--pri)}
.sync{display:inline-flex;align-items:center;align-self:center;line-height:1.2;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:#ffffff2e;color:#fff;white-space:nowrap}.sync.off{background:#fff3d6;color:#92400e}.sync.busy,.sync.load{background:#ffffff40}
.note{background:#ecfdf5;border-color:#a7f3d0;color:#065f46;font-weight:500}
.empty-box{background:#fff;border:1.5px dashed #a7f3d0;border-radius:14px;color:var(--mut);display:grid;gap:4px;justify-items:center}.empty-box b{color:#0f3d2a;font-size:16px}.empty-start{margin-top:10px;background:linear-gradient(135deg,#dcfce7,#e0f2fe);border:0}
.auth-hero{background:linear-gradient(135deg,#d9fbea,#e0f2fe);border:0}.auth-hero h2{color:#0f3d2a}
/* ===== mobile app feel ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overflow-y:auto;height:auto;scroll-behavior:smooth;background:#e9fbf3}
/* body must NOT become its own scroll box: "overflow-x:hidden" on body turned it into an unscrollable scroller that
   swallowed mouse-wheel and finger-swipe scrolling. "clip" hides sideways overflow without creating a scroll box. */
body{overflow-x:clip;overflow-y:visible;height:auto;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
main,#app{overflow:visible;height:auto}
/* closed popups / banners never block touches, clicks or the wheel */
.ov[hidden],.inst[hidden],#m[hidden]{display:none!important;pointer-events:none!important}
.toast{pointer-events:none}
body.auth{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
header{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:56px}
main{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
nav{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav button{min-height:58px;-webkit-user-select:none;user-select:none}
.btn{min-height:44px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.btn.sm{min-height:36px;padding:6px 12px}
a.btn{display:inline-flex;align-items:center}
.chip{min-height:38px;touch-action:manipulation}
input,select,textarea{font-size:16px;min-height:46px}           /* 16px stops phones zooming into fields */
textarea{min-height:76px}textarea.big{min-height:180px;font-size:13px}
input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px;accent-color:var(--pri)}
.seg label{min-height:44px}
.item,.stat{touch-action:manipulation}
.card,.sheet,.empty{overflow-wrap:anywhere}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);text-align:center}
img,svg{max-width:100%}
@media (max-width:360px){.two{grid-template-columns:1fr;gap:0}.grid{grid-template-columns:1fr 1fr}.grid .stat b{font-size:24px}.tg3 b{font-size:20px}header h1{font-size:16px}}
/* reminder popup */
.bell{position:relative;padding:8px 11px}.bdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#f43f5e;color:#fff;font-size:11px;font-weight:700;line-height:19px;text-align:center;box-shadow:0 0 0 2px #0d9488}
.b{white-space:nowrap}.rem .end{min-width:96px}.rem .btns{margin-top:10px}.rem-st{margin-top:6px;font-size:13px;font-weight:600;color:#6d28d9}
.szo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding:8px;background:#f5f3ff;border-radius:10px}.szo .mut{font-size:13px;margin-right:2px}
@media (max-width:420px){.sync .lbl{display:none}.sync{padding:5px 8px}}
@media (max-width:340px){header .pn{display:none}}
/* inspector circle */
nav button{position:relative;min-width:0}nav .nb{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:#f43f5e;color:#fff;font-size:11px;font-style:normal;font-weight:700;line-height:18px}
.allot-tag{margin-top:6px;font-size:13px;color:#1e40af;background:#eef4ff;border:1px solid #c7d7fe;border-radius:10px;padding:5px 8px}
.closed-note{margin-top:6px;font-size:13px;color:#065f46;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:5px 8px}
.allot-btn{color:#1d4ed8;border-color:#bfd3ff;background:#f5f8ff}
.share-note{font-size:12.5px;color:#1e3a8a;background:#eef4ff;border-radius:10px;padding:8px 10px}
.t-desc{margin-top:6px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:6px 9px;font-size:14px}
.task.pending_acceptance{box-shadow:inset 4px 0 #f59e0b,0 2px 8px #0f3d2a0d}.task.accepted{box-shadow:inset 4px 0 #2563eb,0 2px 8px #0f3d2a0d}.task.closed{opacity:.9}
.rk-at{box-shadow:inset 4px 0 #6366f1,0 2px 8px #0f3d2a0d}
.dec-tag{margin-top:6px;font-size:13px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:6px 9px}.dec-tag div{font-size:12.5px;color:#7c2d12}
.ho-tag{margin-top:6px;font-size:12.5px;color:#4c1d95;background:#f5f3ff;border:1px dashed #c4b5fd;border-radius:10px;padding:4px 8px}
.ret-wait{background:linear-gradient(135deg,#ede9fe,#faf5ff);border-color:#ddd6fe}.ret-row{border-top:1px solid #e9d5ff;margin-top:8px;padding-top:8px}
.card.hl{animation:hlPulse 2.4s ease-out 2;outline:2px solid #8b5cf6;outline-offset:1px}@keyframes hlPulse{0%{background:#ede9fe}100%{background:#fff}}
.ret-tag{margin-top:6px;font-size:13.5px;color:#4c1d95;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:10px;padding:7px 9px}.ret-tag .btns{margin-top:6px}
.task.ret{box-shadow:inset 4px 0 #8b5cf6,0 2px 8px #0f3d2a0d}.circle-cta.ret{background:linear-gradient(135deg,#ede9fe,#f5f3ff);border-color:#ddd6fe}
.circ .code{font-size:20px;letter-spacing:2px;color:#0f766e}.mem{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mchip{background:#f0fdf8;border:1px solid #a7f3d0;border-radius:12px;padding:5px 10px;font-size:13.5px;font-weight:600}.mchip small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.row2{display:flex;gap:8px;margin-top:6px}.row2 input{flex:1}.row2 .btn{margin:0;flex-shrink:0}
.circle-cta{cursor:pointer;background:linear-gradient(135deg,#e0e7ff,#f0f9ff);border-color:#c7d2fe}
.chip.on{color:#fff}
@media (max-width:380px){nav button{font-size:11px;padding:8px 2px}}
/* circle messaging */
.chat-head{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:3;margin:10px 0 8px;padding:10px 12px;border-radius:14px;box-shadow:0 2px 10px #0f3d2a14}
.chat-head.dm{background:#f5f3ff;border:1px solid #ddd6fe}.chat-head.ann{background:#fff7ed;border:1px solid #fed7aa}
.mode-note{margin-top:6px;font-size:13px;border-radius:9px;padding:6px 9px}.mode-note.dm{background:#ede9fe;color:#4c1d95}.mode-note.ann{background:#ffedd5;color:#9a3412}

<body>
<header><h1>🐄 Field Officer</h1><div id="hb" class="btns" style="margin:0;align-items:center"></div></header>
<main id="app"></main>

<script>
const K='lvi_field_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ld=d=>{const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const P=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>ld(new Date());
const add=(s,n)=>{const x=P(s);x.setDate(x.getDate()+n);return ld(x)};
const dd=s=>Math.round((P(s)-P(today()))/864e5);
const fmt=s=>s?P(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
const rel=s=>{const n=dd(s);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':n>0?'in '+n+' days':-n+' days overdue'};
const b=(t,c='')=>`<span class="b ${c}">${t}</span>`;
const due=s=>{const n=dd(s);return b(rel(s),n<0?'bad':n<=2?'wn':'')};
const SP=['Cow','Buffalo','Goat','Sheep','Pig','Dog','Cat','Poultry','Horse'];
const EM={Cow:'🐄',Buffalo:'🐃',Goat:'🐐',Sheep:'🐑',Pig:'🐖',Dog:'🐕',Cat:'🐈',Poultry:'🐔',Horse:'🐎'};
const emo=s=>EM[s]||'🐾';
let S,ui={tab:'dash',d:null,hist:[],q:'',sp:'',st:'active',r:'week',t:'all',ps:'Pending',pt:'all',auth:'login'},pend=null;

/* starts empty for a real user; reference lists (SP, EM, PM) are kept above and below */
function seed(){return{cs:[],an:[],tr:[],ai:[],fd:[]}}
/* ---------- Supabase cloud: sign up / login + database ---------- */
const SB_URL='https://dmshweetbwaqcqyzvypf.supabase.co',SB_KEY='sb_publishable_lHQS8S3Jo9B4hgsq6tSBGA_rsHY9RLg';
const sb=(()=>{try{return window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){return null}})();
const TB={cs:'farmers',an:'animals',tr:'treatments',ai:'ai_records',fd:'feed_supplies'},FLDS=Object.keys(TB);
const TK='lvi_test_user';
let U=null,snap=null,known=null,syncT=null,rT=null,syncing=false,again=false,net='ok';
const ph10=p=>String(p||'').replace(/\D/g,'').slice(-10);
/* canonical JSON (sorted keys) so local records and cloud jsonb compare equal */
const cj=v=>Array.isArray(v)?'['+v.map(x=>x===undefined?'null':cj(x)).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+cj(v[k])).join(',')+'}':JSON.stringify(v===undefined?null:v);
const setOf=s=>({aiTarget:s.aiTarget||null,sig:s.sig||'',ucNo:s.ucNo||[],rem:s.rem||{},annRead:s.annRead||{}});
const ck=()=>K+'_cloud_'+U.id; /* offline copy of this account on this device */
const syncLbl={ok:'☁️ Saved',busy:'⏳ Saving…',load:'⏳ Loading…',off:'⚠️ Offline'};
function setSync(st){net=st;const e=$('#sync');if(e){e.className='sync '+st;e.innerHTML=syncHtml(st);e.title=st==='off'?'Changes are kept on this device and will be saved to the cloud automatically when you are back online.':''}}
const syncHtml=st=>{const[i,...w]=syncLbl[st].split(' ');return `${i}<span class="lbl"> ${w.join(' ')}</span>`};
const syncBadge=()=>`<span id="sync" class="sync ${net}" title="${net==='off'?'Changes are kept on this device and will be saved to the cloud automatically when you are back online.':''}">${syncHtml(net)}</span>`;
function writeCache(dirty){if(!U||!S)return;const kn=snap?Object.fromEntries(FLDS.map(f=>[f,[...snap[f].keys()]])):known;try{localStorage.setItem(ck(),JSON.stringify({U,S,dirty,known:kn}))}catch(e){}}
function save(){if(!U||!S)return;writeCache(true);clearTimeout(syncT);syncT=setTimeout(sync,400)}
async function fetchAll(t){let out=[],from=0;for(;;){const{data,error}=await sb.from(t).select('id,data').order('id').range(from,from+999);if(error)throw error;out=out.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return out}
async function pullCloud(){const res=await Promise.all([sb.from('profiles').select('*').eq('id',U.id).maybeSingle(),...FLDS.map(f=>fetchAll(TB[f]))]);const pr=res[0];if(pr.error)throw pr.error;
 const data={};FLDS.forEach((f,i)=>data[f]=res[i+1].map(r=>({...r.data,id:r.id})));return{prof:pr.data,data}}
const mkSnap=(data,set)=>{const s={set:cj(set)};FLDS.forEach(f=>s[f]=new Map(data[f].map(r=>[r.id,cj(r)])));return s};
const profU=(p,user)=>({id:user.id,name:p.full_name||user.user_metadata?.full_name||'',hosp:p.hospital||'',qual:p.qualification||'',age:p.age??'',gender:p.gender||'',phone:p.phone||'',email:p.email||user.email||'',area:p.area||'',created:String(p.created_at||user.created_at||'').slice(0,10)});
/* push every local change (new, edited, deleted records + settings) to the cloud */
async function sync(){if(!U||!S||!sb)return;if(syncing){again=true;return}const me=U.id;syncing=true;setSync('busy');
 try{if(!snap){const c=await pullCloud();if(!U||U.id!==me)return;mergeOffline(c.data);snap=mkSnap(c.data,setOf(c.prof?.settings||{}))}
  for(const f of FLDS){const cur=new Map(S[f].map(r=>[r.id,cj(r)])),old=snap[f];
   const up=[...cur].filter(([id,j])=>old.get(id)!==j),del=[...old.keys()].filter(id=>!cur.has(id));
   for(let i=0;i<up.length;i+=500){const ch=up.slice(i,i+500);const{error}=await sb.from(TB[f]).upsert(ch.map(([id,j])=>({user_id:me,id,data:JSON.parse(j)})),{onConflict:'user_id,id'});if(error)throw error;ch.forEach(([id,j])=>old.set(id,j))}
   for(let i=0;i<del.length;i+=200){const ch=del.slice(i,i+200);const{error}=await sb.from(TB[f]).delete().eq('user_id',me).in('id',ch);if(error)throw error;ch.forEach(id=>old.delete(id))}}
  const sj=cj(setOf(S));if(sj!==snap.set){const{error}=await sb.from('profiles').update({settings:JSON.parse(sj)}).eq('id',me);if(error)throw error;snap.set=sj}
  syncing=false;if(again){again=false;return sync()}if(U&&U.id===me){writeCache(false);setSync('ok')}}
 catch(e){syncing=false;console.warn('Cloud sync failed:',e);if(U&&U.id===me){setSync('off');clearTimeout(rT);rT=setTimeout(sync,15000)}}}
/* when offline edits are pushed: keep records added on other devices meanwhile, apply local deletions */
function mergeOffline(cloud){if(!known)return;FLDS.forEach(f=>{const have=new Set(S[f].map(r=>r.id)),kn=new Set(known[f]||[]);cloud[f].forEach(r=>{if(!have.has(r.id)&&!kn.has(r.id))S[f].push(r)})})}
addEventListener('online',()=>{if(U)sync()});
/* refresh from the cloud when the app comes back to the screen (e.g. edited on another device) */
document.addEventListener('visibilitychange',async()=>{if(document.hidden||!U||!snap||syncing||net==='busy'||!$('#m').hidden)return;let c0=null;try{c0=JSON.parse(localStorage.getItem(ck()))}catch(e){}if(c0&&c0.dirty)return;
 try{const me=U.id,c=await pullCloud();if(!U||U.id!==me||!$('#m').hidden)return;const set=c.prof?.settings||{};S={...c.data,aiTarget:set.aiTarget||undefined,sig:set.sig||'',ucNo:set.ucNo||[],rem:set.rem||{},annRead:set.annRead||{}};snap=mkSnap(c.data,setOf(S));if(c.prof)U=profU(c.prof,{id:me,email:U.email});writeCache(false);render()}catch(e){}});
/* after sign in: load this inspector's records from the cloud (or the offline copy) */
async function startSession(user){if(U&&U.id===user.id&&S)return;U={id:user.id,email:user.email,name:user.user_metadata?.full_name||user.email||''};S=null;snap=null;known=null;ui.auth='loading';ui.note='';setSync('load');render();
 let cache=null;try{cache=JSON.parse(localStorage.getItem(ck()))}catch(e){}known=cache?.known||null;
 try{const c=await pullCloud();if(!U||U.id!==user.id)return;let prof=c.prof;
  if(!prof){const m=user.user_metadata||{};const row={id:user.id,email:user.email,full_name:m.full_name||'',hospital:m.hospital||'',qualification:m.qualification||'',age:+m.age||null,gender:m.gender||null,phone:m.phone||null,area:m.area||''};const r=await sb.from('profiles').upsert(row).select().maybeSingle();prof=r.data||row}
  U=profU(prof,user);const set=prof.settings||{};const cloudS={...c.data,aiTarget:set.aiTarget||undefined,sig:set.sig||'',ucNo:set.ucNo||[],rem:set.rem||{},annRead:set.annRead||{}};
  if(cache&&cache.dirty&&cache.S){S=cache.S;mergeOffline(c.data)}else S=cloudS;snap=mkSnap(c.data,setOf(cloudS));setSync('ok')}
 catch(e){console.warn('Cloud load failed:',e);if(cache&&cache.S){S=cache.S;U=cache.U||U;snap=null;setSync('off')}
  else{U=null;S=null;ui.auth='login';ui.note='⚠️ Could not load your records from the cloud. Check the internet connection (and that the Supabase SQL setup script has been run), then log in again.';await sb.auth.signOut().catch(()=>{});return render()}}
 FLDS.forEach(f=>S[f]=S[f]||[]);
 purgeOldSamples();
 ui.tab='dash';ui.d=null;ui.hist=[];ui.q='';ui.auth='login';closeM();scrollTo(0,0);render();save();pruneRem();ucPrompt();runShortcut();loadCircle(true).then(()=>{loadMsgs(true);startRealtime();setTimeout(checkPopup,600)})}
function endSession(){stopRealtime();popSeen.clear();CI.circles=[];CI.members=[];CI.tasks=[];CI.loaded=false;CI.err='';clearTimeout(syncT);clearTimeout(rT);if(U){let c0=null;try{c0=JSON.parse(localStorage.getItem(ck()))}catch(e){}if(!(c0&&c0.dirty))try{localStorage.removeItem(ck())}catch(e){}}
 U=null;S=null;snap=null;known=null;net='ok';ui.auth=ui.auth==='newpw'?'newpw':'login';closeM();render()}
async function logout(){let c0=null;try{c0=JSON.parse(localStorage.getItem(ck()))}catch(e){}if(c0&&c0.dirty){await sync()}await sb.auth.signOut().catch(()=>{});endSession()}

/* ---------- records saved earlier on this device (before cloud login) ---------- */
/* sources: old single-user data, login-off test data, and an old on-device account with the same email or phone */
function ucSources(){const L=[K,K+'_u_test'];try{(JSON.parse(localStorage.getItem('lvi_users'))||[]).forEach(u=>{if(U&&(u.email===U.email||(U.phone&&u.phone===U.phone)))L.push(K+'_u_'+u.id)})}catch(e){}return L}
/* records not yet in this cloud account (old sample records are never uploaded). Nothing on the device is deleted. */
function unclaimed(){if(!U||!S)return null;const have=new Set(FLDS.flatMap(f=>S[f].map(r=>r.id))),no=new Set(S.ucNo||[]),o={cs:[],an:[],tr:[],ai:[],fd:[]};
 ucSources().forEach(k=>{let x=null;try{x=JSON.parse(localStorage.getItem(k))}catch(e){}if(!x||!x.cs)return;
  const dc=new Set(x.cs.filter(r=>r.demo).map(r=>r.id)),da=new Set((x.an||[]).filter(r=>r.demo||dc.has(r.cid)).map(r=>r.id));
  const keep=(f,r)=>!r.demo&&!have.has(r.id)&&!no.has(r.id)&&!(f==='an'&&dc.has(r.cid))&&!(['tr','ai','fd'].includes(f)&&da.has(r.aid));
  FLDS.forEach(f=>(x[f]||[]).forEach(r=>{if(keep(f,r)&&!o[f].some(y=>y.id===r.id))o[f].push(r)}));if(x.aiTarget)o.aiTarget=x.aiTarget;if(x.sig)o.sig=x.sig});
 return FLDS.some(f=>o[f].length)?o:null}
const ucText=o=>`${o.cs.length} farmer${o.cs.length===1?'':'s'}, ${o.an.length} animal${o.an.length===1?'':'s'}, ${o.tr.length} treatment${o.tr.length===1?'':'s'}, ${o.ai.length} AI/PD record${o.ai.length===1?'':'s'}, ${o.fd.length} feed suppl${o.fd.length===1?'y':'ies'}`;
function claim(){const o=unclaimed();if(!o)return 0;FLDS.forEach(f=>{const have=new Set(S[f].map(x=>x.id));o[f].forEach(x=>{if(!have.has(x.id)){S[f].push(x);have.add(x.id)}})});
 if(o.aiTarget&&!S.aiTarget)S.aiTarget=o.aiTarget;if(o.sig&&!S.sig)S.sig=o.sig;save();return 1}
function ucPrompt(){const o=unclaimed();if(!o)return;sheet('Records found on this device',`<p>These records were saved on this phone before cloud login:</p><p><b>${ucText(o)}</b></p><p class="mut">Upload them to your cloud account? The copy on this device is kept as a backup.</p><div class="btns"><button class="btn pri" data-a="ucY">Upload to my account</button><button class="btn" data-a="ucN">Not now</button></div>`)}

/* ---------- sign up / login screens ---------- */
const QUAL=['B.V.Sc & A.H.','M.V.Sc','Ph.D (Veterinary)','Diploma in Livestock Management','Livestock Inspector Certificate','Diploma in Dairy Technology','Other'];
const sel=(l,n,opts,v,x='')=>`<label>${l}<select name="${n}" ${x}>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
const profFields=(u={},edit)=>fl('Full name *','name',u.name,'text','required autocomplete="name"')+fl('Veterinary hospital / centre name *','hosp',u.hosp,'text','required')
 +`<label>Qualification *<input name="qual" list="qlist" value="${esc(u.qual)}" required><datalist id="qlist">${QUAL.map(q=>`<option value="${esc(q)}">`).join('')}</datalist></label>`
 +`<div class="two">${fl('Age *','age',u.age,'number','required min="18" max="90" inputmode="numeric"')}${sel('Gender *','gender',['Male','Female','Other'],u.gender)}</div>`
 +fl('Phone number *','phone',u.phone,'tel','required inputmode="tel" autocomplete="tel"')+(edit?fl('Email ID (login, cannot be changed here)','email',u.email,'email','readonly'):fl('Email ID *','email',u.email,'email','required autocomplete="email"'))
 +fl('Area / Panchayat *','area',u.area,'text','required');
const profObj=d=>({name:d.name.trim(),hosp:d.hosp.trim(),qual:d.qual.trim(),age:d.age,gender:d.gender,phone:ph10(d.phone),email:(d.email||'').trim().toLowerCase(),area:d.area.trim()});
function errMsg(e){const m=String(e&&(e.message||e.error_description||e)||'');
 if(/invalid login credentials/i.test(m))return 'Incorrect email / phone or password. Please try again.';
 if(/email not confirmed/i.test(m))return 'Your email is not confirmed yet. Open the confirmation link sent to your inbox, then log in.';
 if(/already registered|already exists/i.test(m))return 'An account with this email already exists. Please log in.';
 if(/password should be|at least 6/i.test(m))return 'Password / PIN must be at least 6 characters.';
 if(/rate limit|too many/i.test(m))return 'Too many attempts. Please wait a minute and try again.';
 if(/failed to fetch|network|load failed/i.test(m))return 'Cannot reach the server. Check your internet connection.';
 if(/database error saving new user/i.test(m))return 'This phone number or email is already registered.';
 if(/duplicate key|profiles_phone_key/i.test(m))return 'An account with this phone number already exists.';
 return m||'Something went wrong. Please try again.'}
function authView(){const v=ui.auth,tp=(()=>{try{const t=JSON.parse(localStorage.getItem(TK));if(t&&t.id==='test'){const{id,created,...r}=t;return r}}catch(e){}return{}})();
 const pw=(n,l,ac)=>fl(l,n,'','password',`required minlength="6" autocomplete="${ac}"`);
 const note=ui.note?`<div class="card note">${esc(ui.note)}</div>`:'';
 const hero=`<div class="card auth-hero" style="text-align:center;padding:20px"><div style="font-size:44px">🐄</div><h2 style="margin:4px 0">Livestock Inspector</h2><div class="mut">Farmers · Animals · Treatment · AI · PD · Feed · Payments</div></div>`;
 if(v==='loading')return `<div class="auth-box">${hero}<div class="card" style="text-align:center;padding:26px"><div style="font-size:30px">⏳</div><b>Loading your records…</b><div class="mut">Connecting to the cloud</div></div></div>`;

/* ---------- 📜 History: clinical timeline (animal / farmer) and the inspector's Activity Log ----------
   Built from the inspector's own records (private) plus their own circle tasks. Nothing new is stored. */
const LCAT={tr:['💉','Treatments'],ai:['🧬','AI & PD'],fu:['📅','Follow-ups'],circle:['👥','Circle'],feed:['🌾','Feed & weight'],pay:['💰','Payments'],animal:['🐄','Animals']};
const isoOf=v=>{const s=String(v||'');return s.length===10?s+'T12:00:00.000Z':s};
function histEvents(opt={}){const E=[],ev=(ts,cat,title,sub,aid,extra)=>{if(ts)E.push({ts:isoOf(ts),cat,title,sub:sub||'',aid,...extra})};
 const anm=aid=>{const a=A(aid),c=a&&C(a.cid);return a?`${emo(a.species)} ${aname(a)}${c?' · '+c.name:''}`:''};
 const cl=(c,what,aid)=>c&&ev(c.at,'fu',`${what} closed${c.by&&c.by!=='me'?' by '+c.by:''}`,c.note,aid);
 S.tr.forEach(t=>{const w=anm(t.aid);
  ev(t.date,'tr',t.visit?'📌 Planned visit':t.byOther?`Treatment by ${t.byOther} (circle)`:'Treatment recorded',[t.dx,t.meds&&'Medicines: '+t.meds,t.notes].filter(Boolean).join(' · '),t.aid,{who:w});
  if(t.next&&!t.fuFrom&&!t.visit)ev(t.date,'fu',`Follow-up scheduled for ${fmt(t.next)}`,t.dx,t.aid,{who:w});
  (t.fuLog||[]).forEach(c=>cl(c,'Treatment follow-up',t.aid));cl(t.closure,t.visit?'Planned visit':'Treatment follow-up',t.aid);
  if(!opt.clinical&&+t.amt&&t.pst==='Paid')ev(t.paidOn||t.date,'pay',`Payment received ${rs(t.amt)}${t.mode&&t.mode!=='None'?' · '+t.mode:''}`,'Treatment'+(t.dx?': '+t.dx:''),t.aid,{who:w})});
 S.ai.forEach(r=>{const w=anm(r.aid);
  ev(r.date,'ai',r.byOther?`AI by ${r.byOther} (circle)`:'AI recorded',[r.semen&&'Semen / bull: '+r.semen,r.notes].filter(Boolean).join(' · '),r.aid,{who:w});
  if(r.status==='aborted'){ev(r.abDate,'ai','⚠️ Pregnancy aborted',[r.abNotes,r.due&&'was due '+fmt(r.due)].filter(Boolean).join(' · '),r.aid,{who:w});if(r.hcDate)ev(r.abDate,'fu',`Post-abortion follow-up / heat check scheduled for ${fmt(r.hcDate)}`,r.hcNote,r.aid,{who:w});cl(r.hcClosure,'Post-abortion follow-up',r.aid)}
  if(r.status!=='pending')ev(r.pdOn||r.pd,'ai',r.status==='confirmed'||r.status==='aborted'?'PD: pregnancy confirmed ✅':'PD: not confirmed ❌',r.status==='confirmed'&&r.due?'Expected due '+fmt(r.due):r.rDate?'Repeat AI planned '+fmt(r.rDate):'',r.aid,{who:w});
  (r.fuLog||[]).forEach(c=>cl(c,'AI follow-up',r.aid));cl(r.fuClosure,'AI follow-up',r.aid);cl(r.rClosure,'Repeat AI',r.aid);
  if(!opt.clinical){if(+r.amt&&r.pst==='Paid')ev(r.paidOn||r.date,'pay',`Payment received ${rs(r.amt)}${r.mode&&r.mode!=='None'?' · '+r.mode:''}`,'AI',r.aid,{who:w});
   if(+r.pdAmt&&r.pdPst==='Paid')ev(r.pdPaidOn||r.pdOn||r.pd,'pay',`Payment received ${rs(r.pdAmt)}${r.pdMode&&r.pdMode!=='None'?' · '+r.pdMode:''}`,'PD Check',r.aid,{who:w})}});
 S.fd.forEach(f=>{const w=anm(f.aid);ev(f.date,'feed','Free feed supplied',[f.feed,f.qty,f.bw&&'weight '+kg(f.bw)].filter(Boolean).join(' · '),f.aid,{who:w});
  (f.checks||[]).forEach(c=>ev(c.date,'feed',`Weight check: ${kg(c.kg)}`,c.note,f.aid,{who:w}))});
 S.an.forEach(a=>(a.hist||[]).forEach(h=>{const t=h.text||'';if(/^Pregnancy aborted|^Abortion record undone|closed( by .+?)?( —|$)| was declined|allotted to .+: (closed|declined|cancelled)|completed by me|done by me/.test(t))return;   /* shown from the records / circle instead */
  ev(h.date,/^Next follow-up set|follow-up/i.test(t)?'fu':/allotted/i.test(t)?'circle':'animal',t,'',a.id,{who:anm(a.id)})}));
 if(!opt.clinical)CI.tasks.forEach(t=>{const mine=t.from_user===U.id,o=mine?t.to_name||'colleague':t.from_name||'colleague',ti=t.title;
  if(mine){ev(t.created_at,'circle',`Allotted to ${o}`,ti);t.accepted_at&&ev(t.accepted_at,'circle',`${o} accepted`,ti);t.declined_at&&ev(t.declined_at,'circle',`${o} declined`,[ti,t.response_note].filter(Boolean).join(' · '));
   t.status==='closed'&&ev(t.closed_at,'circle',t.returned_to_sender?`${o} closed it (returned to you)`:'You closed the allotment',[ti,t.closure_note].filter(Boolean).join(' · '));
   t.status==='cancelled'&&ev(t.updated_at,'circle','You cancelled the allotment',ti);t.follow_up_set_at&&ev(t.follow_up_set_at,'fu',t.follow_up_status==='not_needed'?'No further follow-up needed':'You set the next follow-up',ti)}
  else{ev(t.created_at,'circle',`Task received from ${o}`,ti);t.accepted_at&&ev(t.accepted_at,'circle','You accepted',ti);t.declined_at&&ev(t.declined_at,'circle','You declined',[ti,t.response_note].filter(Boolean).join(' · '));
   t.status==='closed'&&t.closed_by===U.id&&ev(t.closed_at,'circle','You closed it (returned to sender)',[ti,t.closure_note].filter(Boolean).join(' · '))}});
 if(opt.aids)return E.filter(e=>opt.aids.has(e.aid)).sort((x,y)=>y.ts.localeCompare(x.ts));
 return E.sort((x,y)=>y.ts.localeCompare(x.ts))}
function evRow(e,showWho){const[ic]=LCAT[e.cat]||['•'];const t=e.ts.length>10&&!e.ts.endsWith('T12:00:00.000Z')?new Date(e.ts).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'';
 return `<div class="ev ev-${e.cat}"${e.aid&&A(e.aid)?` data-a="open" data-k="a" data-id="${e.aid}"`:''}><span class="ev-ic">${ic}</span><div class="ev-b"><b>${esc(e.title)}</b>${e.sub?`<div class="mut">${esc(e.sub)}</div>`:''}${showWho&&e.who?`<div class="mut ev-w">${esc(e.who)}</div>`:''}</div>${t?`<span class="ev-t">${t}</span>`:''}</div>`}
function evGroups(L,showWho){let day='';return L.map(e=>{const d=e.ts.slice(0,10),h=d!==day?(day=d,`<div class="ev-day">${fmt(d)}</div>`):'';return h+evRow(e,showWho)}).join('')}

function logList(){const q=(ui.lq||'').toLowerCase(),from=ui.lr==='all'?'':add(today(),-(+ui.lr||30));
 const L=histEvents().filter(e=>(ui.lf==='all'||e.cat===ui.lf)&&(!from||e.ts.slice(0,10)>=from)&&(!q||[e.title,e.sub,e.who].join(' ').toLowerCase().includes(q)));
 ui.lmax=ui.lmax||200;if(!L.length)return emptyBox('📜','Nothing here yet.',S.cs.length?'Try another filter, a longer date range or a different search.':'Your actions will appear here once you start adding records.');
 return `<div class="mut" style="font-size:13px;margin-bottom:6px">${L.length} event${L.length>1?'s':''}</div>${evGroups(L.slice(0,ui.lmax),true)}${L.length>ui.lmax?`<div class="btns" style="justify-content:center"><button class="btn" data-a="logMore">Show more</button></div>`:''}`}

/* ---------- reminder popup: 1 day before, due today and overdue · Snooze / Stop ---------- */
/* Each alert has a key (type : record : date [: stage]). Snooze / Stop are stored in S.rem, which is saved to the
   inspector's Supabase profile (settings), so they survive refresh, re-login and other devices. Records are never changed. */
const RK={hc:['🩺','Post-abortion follow-up / heat check','rk-ai'],tr:['💉','Treatment follow-up','rk-tr'],ai:['🧬','AI follow-up','rk-ai'],pd:['🩺','PD check due','rk-pd'],rai:['🔁','Repeat AI due','rk-rai'],cf:['🤰','Pregnancy follow-up','rk-pg'],due:['🍼','Expected due (calving) date','rk-pg'],wt:['⚖️','3-month weight check','rk-wt']};
const recOf=a=>(a.k==='tr'?S.tr:a.k==='wt'?S.fd:S.ai).find(x=>x.id===a.id);
const monthKey=()=>'tgt:'+today().slice(0,7);
function alerts(){const L=[];
 fups().forEach(f=>{const n=dd(f.date);const rr=f.k==='wt'?null:recOf(f);if(rr&&rr.allot&&rr.allot.status==='accepted'&&(!rr.allot.k||rr.allot.k===f.k||(rr.allot.k==='visit'&&f.k==='tr')))return;  /* a colleague accepted it */
  if(f.k==='due'){L.push({...f,stage:n<=1?'d1':'lead',key:`due:${f.id}:${f.date}:${n<=1?'d1':'lead'}`});return}  /* 10/20-day window, then a separate 1-day-before alert */
  if(n<=1)L.push({...f,key:`${f.k}:${f.id}:${f.date}`})});                                                        /* tomorrow, today or overdue */
 CI.tasks.filter(x=>x.to_user===U.id&&x.status==='accepted'&&x.due_date&&dd(x.due_date)<=1).forEach(x=>L.push({k:'at',id:x.id,date:x.due_date,key:`at:${x.id}:${x.due_date}`,task:x}));  /* allotted to me */
 returnedToMe().forEach(x=>{const cd=x.closed_date||String(x.closed_at||'').slice(0,10)||today();L.push({k:'ret',id:x.id,date:cd,key:`ret:${x.id}`,task:x})});  /* back with me: set next follow-up */
 const t=aiStats();if(S.cs.length&&t.left>0)L.push({k:'tgt',key:'tgt:'+today(),t});
 return L}
/* null = active · 'snooze' · 'stop' · 'seen' (daily AI target already shown today) */
function remState(a){const R=S.rem||{},now=Date.now();if(a.k==='tgt'){if(R[monthKey()]&&R[monthKey()].stop)return 'stop'}const s=R[a.key];if(!s)return null;if(s.stop)return 'stop';if(s.until&&s.until>now)return 'snooze';if(s.seen)return 'seen';return null}
const activeAlerts=()=>alerts().filter(a=>!remState(a));
const fmtTs=ms=>new Date(ms).toLocaleString('en-IN',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const tomorrow8=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(8,0,0,0);return d.getTime()};
const SZ={'2h':['2 hours',()=>Date.now()+2*36e5],'tm':['Tomorrow 8 AM',tomorrow8],'1d':['1 day',()=>Date.now()+864e5]};
/* drop old snooze / stop entries so the saved list stays small */
function pruneRem(){const R=S.rem||{},now=Date.now(),old=now-120*864e5;Object.keys(R).forEach(k=>{const v=R[k]||{};if((v.until&&v.until<now-7*864e5&&!v.stop)||(v.t&&v.t<old))delete R[k]});S.rem=R}
function remDetail(a,r){if(a.k==='hc')return `Aborted ${fmt(r.abDate)}${r.hcNote?' · '+esc(r.hcNote):''}`;if(a.k==='rai')return `Previous AI ${fmt(r.date)} · PD not confirmed ${fmt(pdOnOf(r))}`;
 if(a.k==='cf')return `Pregnant · AI ${fmt(r.date)}${r.due?' · due '+fmt(r.due):''}`;
 if(a.k==='due')return a.stage==='lead'?`Advance reminder (${leadOf(r)} days before) · AI ${fmt(r.date)}`:`1 day before / due now · AI ${fmt(r.date)}`;
 if(a.k==='wt')return `Free feed supplied ${fmt(r.date)} · ${esc(r.feed)}`;
 if(a.k==='pd')return `AI ${fmt(r.date)} · record the PD result`;
 if(a.k==='ai')return `AI done ${fmt(r.date)}`;
 return esc(r.dx||'')}
function remCard(a,st){if(a.k==='at')return atCard(a,st);if(a.k==='ret')return retCard(a,st);const sb=st==='stop'?'<div class="rem-st">🔕 Stopped</div>':st==='snooze'?`<div class="rem-st">💤 Snoozed until ${fmtTs((S.rem[a.key]||{}).until)}</div>`:'';
 const ctl=st&&st!=='seen'?`<button class="btn sm" data-a="remRes" data-id="${a.key}">↩ Resume</button>`:`<button class="btn sm" data-a="remSz" data-id="${a.key}">💤 Snooze</button><button class="btn sm" data-a="remStop" data-id="${a.key}">🔕 Stop</button>`;
 const szo=`<div class="szo" hidden><span class="mut">Snooze for:</span>${Object.entries(SZ).map(([m,[l]])=>`<button class="chip" data-a="remSzGo" data-id="${a.key}|${m}">${l}</button>`).join('')}</div>`;
 if(a.k==='tgt'){const t=a.t;return `<div class="card rem rk-ai"><div class="between"><div><b>🎯 Daily AI target</b><div>${t.left} more AI procedure${t.left>1?'s':''} remaining out of ${t.T} this month</div><div class="mut">${t.done} done · ${t.dl} day${t.dl>1?'s':''} left · aim for about ${t.perDay} per day</div></div><div class="end">${b(t.pct+'%','wn')}</div></div>${sb}
  <div class="btns"><button class="btn sm pri" data-a="remGo" data-id="qAI|">+ Log AI</button>${st&&st!=='seen'?ctl:`<button class="btn sm" data-a="remSz" data-id="${a.key}">💤 Snooze</button><button class="btn sm" data-a="remStop" data-id="${a.key}">🔕 Stop this month</button>`}</div>${szo}</div>`}
 const r=recOf(a),an=A(a.aid);if(!r||!an)return '';const c=C(an.cid),[ic,lbl,cls]=RK[a.k];
 const main=a.k==='pd'?`<button class="btn sm pri" data-a="remGo" data-id="pdr|${r.id}">Record result</button>`:a.k==='rai'?`<button class="btn sm pri" data-a="remGo" data-id="reAI|${r.id}">Record Repeat AI</button>`:a.k==='wt'?`<button class="btn sm pri" data-a="remGo" data-id="wtV|${r.id}">⚖️ Verify Weight</button>`:(a.k==='cf'||a.k==='due')?`<button class="btn sm pri" data-a="remGo" data-id="p|${r.id}">Open pregnancy page</button><button class="btn sm ab-btn" data-a="abort" data-id="${r.id}">⚠️ Mark as Aborted</button>`:`<button class="btn sm pri" data-a="remGo" data-id="a|${an.id}">Open animal</button>`;
 const ex=a.k==='tr'?(r.dx||''):a.k==='hc'?hcEx(r):a.k==='rai'?raiEx(r):a.k==='cf'?cfEx(r):a.k==='due'?dueEx(r):a.k==='wt'?fdEx(r):'AI done on '+fmt(r.date);
 return `<div class="card rem ${cls}"><div class="between" style="align-items:flex-start"><div><b>${ic} ${lbl}</b><div>${emo(an.species)} ${esc(aname(an))} · 👤 ${esc(c?.name)}</div><div class="mut">${remDetail(a,r)}</div></div><div class="end"><div style="font-size:13px">${fmt(a.date)}</div>${due(a.date)}</div></div>${sb}
 <div class="btns">${main}${fuBtns(a.k,an.id,a.date,ex)}${['tr','ai','pd','rai'].includes(a.k)?fuActs(a.k,r.id):''}${ctl}</div>${szo}</div>`}
function atCard(a,st){const t=a.task,p=t.payload||{},an=p.animal||{},f=p.farmer||{};const sb2=st==='stop'?'<div class="rem-st">🔕 Stopped</div>':st==='snooze'?`<div class="rem-st">💤 Snoozed until ${fmtTs((S.rem[a.key]||{}).until)}</div>`:'';
 const ctl=st&&st!=='seen'?`<button class="btn sm" data-a="remRes" data-id="${a.key}">↩ Resume</button>`:`<button class="btn sm" data-a="remSz" data-id="${a.key}">💤 Snooze</button><button class="btn sm" data-a="remStop" data-id="${a.key}">🔕 Stop</button>`;
 return `<div class="card rem rk-at"><div class="between" style="align-items:flex-start"><div><b>👥 Allotted task</b><div>${esc(t.title)}</div><div class="mut">${emo(an.species)} ${esc(an.tag||an.species||'')} · 👤 ${esc(f.name||'')} · from ${esc(t.from_name||'colleague')}</div></div><div class="end"><div style="font-size:13px">${fmt(a.date)}</div>${due(a.date)}</div></div>${sb2}
 <div class="btns"><button class="btn sm pri" data-a="remGo" data-id="tab|circle">Open in Circle</button>${taskMsg(t)}<button class="btn sm" data-a="tClose" data-id="${t.id}">✔ Mark closed</button>${ctl}</div><div class="szo" hidden><span class="mut">Snooze for:</span>${Object.entries(SZ).map(([m,[l]])=>`<button class="chip" data-a="remSzGo" data-id="${a.key}|${m}">${l}</button>`).join('')}</div></div>`}
function retCard(a,st){const t=a.task,p=t.payload||{},an=p.animal||{},f=p.farmer||{};const ctl=st&&st!=='seen'?`<button class="btn sm" data-a="remRes" data-id="${a.key}">↩ Resume</button>`:`<button class="btn sm" data-a="remSz" data-id="${a.key}">💤 Snooze</button><button class="btn sm" data-a="remStop" data-id="${a.key}">🔕 Stop</button>`;
 return `<div class="card rem rk-at"><div class="between" style="align-items:flex-start"><div><b>↩ Returned: set next follow-up</b><div>${esc(t.title)}</div><div class="mut">${emo(an.species)} ${esc(an.tag||an.species||'')} · 👤 ${esc(f.name||'')} · closed by ${esc(t.to_name||'colleague')} on ${fmt(a.date)}</div><div class="mut">📝 ${esc(t.closure_note||'')}</div></div><div class="end">${b('Closed by Assignee','ok')}</div></div>
 <div class="btns"><button class="btn sm pri" data-a="retSet" data-id="${t.id}">📅 Set next follow-up</button><button class="btn sm" data-a="retNone" data-id="${t.id}">No further follow-up</button>${ctl}</div><div class="szo" hidden><span class="mut">Snooze for:</span>${Object.entries(SZ).map(([m,[l]])=>`<button class="chip" data-a="remSzGo" data-id="${a.key}|${m}">${l}</button>`).join('')}</div></div>`}
let popSeen=new Set(),popOpen=false,hiddenAt=0;
/* all = opened from the 🔔 button: also lists snoozed / stopped alerts so they can be resumed */
function remPopup(all){const L=alerts(),act=L.filter(a=>!remState(a)),rest=L.filter(a=>remState(a));
 if(!all&&!act.length)return;popOpen=true;act.forEach(a=>popSeen.add(a.key));
 const head=act.length?`<p class="mut" style="margin-top:0">${act.length} reminder${act.length>1?'s':''} due tomorrow, today or overdue. Snooze to see it again later; Stop to silence that reminder (records are not changed).</p>`:'<p class="mut" style="margin-top:0">No reminders need attention right now. 🎉</p>';
 sheet(`🔔 Reminders${act.length?' ('+act.length+')':''}`,`${head}${act.map(a=>remCard(a,null)).join('')}
 ${act.length>1?`<div class="btns" style="margin:4px 0 10px"><button class="btn" data-a="remAll" data-id="tm">💤 Snooze all until tomorrow 8 AM</button></div>`:''}
 ${all&&rest.length?`<details style="margin-top:6px"><summary class="mut" style="cursor:pointer">Snoozed / stopped / already seen today (${rest.length})</summary><div style="margin-top:8px">${rest.map(a=>remCard(a,remState(a))).join('')}</div></details>`:''}`)}
/* closing the popup counts the daily AI target as seen for today */
function remClosed(){if(!popOpen)return;popOpen=false;if(!S)return;const a=alerts().find(x=>x.k==='tgt');if(a&&!remState(a)){S.rem=S.rem||{};S.rem[a.key]={seen:1,t:Date.now()};save()}updBell()}
function remSet(key,v){S.rem=S.rem||{};if(v)S.rem[key]={...v,t:Date.now()};else delete S.rem[key];save();updBell()}
function remRefresh(){const was=$('#m .sheet h3')?.textContent||'';popOpen=false;$('#m').hidden=true;$('#m').innerHTML='';render();if(was.startsWith('🔔'))remPopup(true)}
function checkPopup(){if(!U||!S||document.hidden||!$('#m').hidden||document.body.classList.contains('auth'))return;
 if(activeAlerts().some(a=>!popSeen.has(a.key)))remPopup(false)}
function updBell(){const e=$('#bellN');if(!e||!S)return;const n=activeAlerts().length;e.textContent=n;e.hidden=!n}
setInterval(()=>{updBell();checkPopup()},30000);   /* also brings a snoozed reminder back when its time is up */
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}if(hiddenAt&&Date.now()-hiddenAt>2*36e5)popSeen.clear();setTimeout(checkPopup,1200)});

/* ---------- installable mobile app (PWA) ---------- */
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobile=()=>isIOS()||/android|mobile/i.test(navigator.userAgent);
const IK='lvi_install_hide';let deferredPrompt=null;
const instSnoozed=()=>{try{return +localStorage.getItem(IK)>Date.now()}catch(e){return false}};
const shareIc='<svg class="shr" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function showInstall(){const el=$('#inst');if(!el||isStandalone()||instSnoozed())return;
 if(deferredPrompt)el.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="inst-tx"><b>Install Field Officer</b>Open it from your home screen like an app. Starts fast and opens offline.</div><div class="inst-bt"><button class="btn pri sm" data-a="instGo">Install</button><button class="btn sm" data-a="instNo" aria-label="Not now">✕</button></div>`;
 else if(isIOS())el.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="inst-tx"><b>Add to Home Screen</b>Tap ${shareIc} <b style="display:inline;font-size:13px">Share</b>, then <b style="display:inline;font-size:13px">“Add to Home Screen”</b>.</div><div class="inst-bt"><button class="btn sm" data-a="instNo" aria-label="Close">✕</button></div>`;
 else return;el.hidden=false}
function installHelp(){const ios=isIOS();sheet('📲 Install the app',ios?`<ol style="padding-left:20px;line-height:1.8"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button ${shareIc} at the bottom (or top) of the screen.</li><li>Scroll down and tap <b>“Add to Home Screen”</b>, then <b>Add</b>.</li></ol><p class="mut">The Field Officer icon appears on your home screen and opens full-screen like an app.</p>`
 :`<ol style="padding-left:20px;line-height:1.8"><li>Open this page in <b>Chrome</b> (or Edge / Samsung Internet).</li><li>Tap the menu <b>⋮</b> at the top right.</li><li>Tap <b>“Install app”</b> or <b>“Add to Home screen”</b>, then <b>Install</b>.</li></ol><p class="mut">The Field Officer icon appears on your home screen and opens full-screen like an app.</p>`)}
async function doInstall(){if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;$('#inst').hidden=true;closeM();try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==='accepted')toast('Installing Field Officer…')}catch(e){}return}installHelp()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setTimeout(showInstall,1500)});
addEventListener('appinstalled',()=>{deferredPrompt=null;const el=$('#inst');if(el)el.hidden=true;toast('✅ App installed. Open it from your home screen.')});
/* iPhone / iPad have no install prompt: show the short guide once the page has settled */
if(isIOS()&&!isStandalone())setTimeout(showInstall,3000);
/* home-screen shortcuts: ?go=qT (treatment), qAI, qPD, qFD */
function runShortcut(){const q=new URLSearchParams(location.search),go=q.get('go');if(!go||!['qT','qAI','qPD','qFD'].includes(go))return;
 q.delete('go');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);setTimeout(()=>act(go),350)}
/* service worker: fast start + offline opening (Supabase sign-in and data requests are never cached) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
 addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>setInterval(()=>reg.update().catch(()=>{}),3600000)).catch(e=>console.warn('Service worker not registered:',e)));

/* ---------- start: wait for Supabase to report the saved session ---------- */
ui.auth=sb?'loading':'login';render();
if(sb){let first=true;
 sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
  if(ev==='PASSWORD_RECOVERY'){U=null;S=null;ui.auth='newpw';ui.note='';return render()}
  if(ev==='SIGNED_OUT')return endSession();
  if(session&&session.user&&ui.auth!=='newpw'){if(!U||U.id!==session.user.id)startSession(session.user)}
  else if(first&&!session){ui.auth='login';render()}
  first=false},0)})}
</script>
</body>
