/* ===== mobile app feel ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overflow-y:auto;height:auto;scroll-behavior:smooth;background:#e9fbf3}
/* body must NOT become its own scroll box: "overflow-x:hidden" on body turned it into an unscrollable scroller that
   swallowed mouse-wheel and finger-swipe scrolling. "clip" hides sideways overflow without creating a scroll box. */
body{overflow-x:clip;overflow-y:visible;height:auto;-webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

/* ---------- Animal tag / identification photos ----------
   Photos are NOT stored in database rows. They are shrunk on the phone (max 1024 px, JPEG ~0.78, aim ≤ 350 KB),
   uploaded to the private Supabase Storage bucket `animal-tag-photos` inside the inspector's own folder
   (<user id>/<animal id>/<file>.jpg — enforced by Storage RLS), and the animal record keeps only
   photo = {p: path, kb, w, h, at}. Replaced / removed / deleted-animal photos are removed from Storage straight away;
   anything missed (e.g. no internet at that moment) is cleaned up by the tag_photo_orphans() sweep at the next login. */
const PB='animal-tag-photos',PCACHE='lvi-tagphotos',PH={url:new Map(),busy:new Map(),up:new Map(),t:0,swept:false};
const PMAX=1024,PQ=[0.78,0.7,0.62],PKB=350,PIN=25*1048576,PLIM=1000*1024;
const kbTxt=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const myPath=p=>!!(p&&U&&typeof p==='string'&&p.startsWith(U.id+'/'));
const phOf=a=>a&&a.photo&&myPath(a.photo.p)?a.photo:null;
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};im.src=u})}
/* resize + compress on the device; browsers apply the camera's EXIF rotation when drawing, so photos stay upright */
async function squeeze(file){
 if(!file)throw new Error('No photo selected.');
 if(file.type&&!/^image\//i.test(file.type))throw new Error('Please choose a photo (JPG, PNG, WebP or HEIC).');
 if(file.size>PIN)throw new Error(`This file is ${kbTxt(file.size)}. Please choose a photo smaller than 25 MB.`);
 let L;try{L=await loadImg(file)}catch(e){throw new Error('This photo could not be opened on this phone. Take a new photo, or choose a JPG / PNG.')}
 const{im,u}=L;try{const W=im.naturalWidth,H=im.naturalHeight;if(!W||!H)throw new Error('This photo looks empty. Please try another one.');
  let blob=null,w=0,h=0;
  for(const max of [PMAX,800,640]){const m=Math.min(1,max/Math.max(W,H));w=Math.max(1,Math.round(W*m));h=Math.max(1,Math.round(H*m));
   const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
   for(const q of PQ){blob=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(!blob)throw new Error('Could not compress this photo on this phone.');if(blob.size<=PKB*1024)break}
   c.width=c.height=0;if(blob.size<=PKB*1024)break}
  if(blob.size>PLIM)throw new Error('This photo is still too large after compression. Please take a closer, simpler photo of the tag.');
  return{blob,w,h,orig:file.size}}finally{URL.revokeObjectURL(u)}}
/* private display: download with the inspector's session → blob: URL (allowed by the CSP); small offline copy in Cache Storage */
async function phCache(){try{return 'caches' in window?await caches.open(PCACHE):null}catch(e){return null}}
const phKey=p=>new Request(location.origin+'/__tagphoto/'+encodeURIComponent(p));
function phRemember(p,u){PH.url.set(p,u);if(PH.url.size>60){const k=PH.url.keys().next().value,o=PH.url.get(k);PH.url.delete(k);if(!/^blob:/.test(o)||![...PH.up.values()].some(j=>j.url===o))try{URL.revokeObjectURL(o)}catch(e){}}}
function photoUrl(p){if(!myPath(p)||!sb)return Promise.resolve(null);if(PH.url.has(p))return Promise.resolve(PH.url.get(p));if(PH.busy.has(p))return PH.busy.get(p);
 const me=U.id,job=(async()=>{try{const c=await phCache();const hit=c&&await c.match(phKey(p));if(hit){const b0=await hit.blob();if(U&&U.id===me){const u=URL.createObjectURL(b0);phRemember(p,u);return u}}}catch(e){}
  try{const{data,error}=await sb.storage.from(PB).download(p);if(error||!data)throw error||new Error('empty');if(!U||U.id!==me)return null;
   try{const c=await phCache();c&&await c.put(phKey(p),new Response(data,{headers:{'Content-Type':'image/jpeg'}}))}catch(e){}
   const u=URL.createObjectURL(data);phRemember(p,u);return u}catch(e){return null}})();
 PH.busy.set(p,job);job.finally(()=>PH.busy.delete(p));return job}
function phPut(el,u,status){el.textContent='';el.classList.remove('ph-load');if(!u){el.classList.add('ph-err');el.textContent=navigator.onLine?'📷 Photo could not be loaded. Pull down / reopen to retry.':'📷 Photo not available offline yet — it loads when you are online.';return}

function hydratePh(){document.querySelectorAll('[data-ph]:not([data-phd])').forEach(el=>{const p=el.getAttribute('data-ph');el.setAttribute('data-phd','1');if(!myPath(p))return phPut(el,null);

new MutationObserver(()=>{clearTimeout(PH.t);PH.t=setTimeout(hydratePh,20)}).observe(document.body,{childList:true,subtree:true});
async function phForget(paths){const c=await phCache();for(const p of paths){const u=PH.url.get(p);PH.url.delete(p);if(u)try{URL.revokeObjectURL(u)}catch(e){}try{c&&await c.delete(phKey(p))}catch(e){}}}
/* remove files from Storage (own folder only; failures are picked up later by the orphan sweep) */
async function rmPhotos(paths){const used=new Set((S?S.an:[]).map(a=>a.photo&&a.photo.p).filter(Boolean));const L=[...new Set(paths)].filter(p=>myPath(p)&&!used.has(p));if(!L.length||!sb)return;

function phQueue(aid,pic){const old=PH.up.get(aid);if(old&&old.url!==pic.url)try{URL.revokeObjectURL(old.url)}catch(e){}PH.up.set(aid,{...pic,busy:false,err:''});upPhoto(aid)}

  j.err=/bucket.*not.*found|not found/i.test(m)?'Photo storage is not set up yet (run supabase-tag-photos.sql).':/row-level|policy|unauthor|403/i.test(m)?(canWrite()?'Upload was refused by the server (photo limit reached or not allowed).':'Subscription expired — renew to upload photos.'):/size|large|413/i.test(m)?'Photo too large for the server limit.':navigator.onLine?'Upload failed — tap Retry.':'No internet — the photo uploads automatically when you are back online (keep the app open).';

  const before=new Set(CM.msgs.map(m=>m.id));const fresh=data||[];
  if(CM.loaded)fresh.filter(m=>!before.has(m.id)&&m.sender_id!==U.id).forEach(m=>notifyMsg(m));
  CM.msgs=fresh;CM.loaded=true;CM.err=''}
 catch(e){CM.err=mErr(e);if(!quiet)console.warn('Messages load failed:',e)}
 finally{CM.busy=false}
 if(U&&U.id===me)msgRefresh()}
/* live updates (Realtime applies the same row security, so only allowed messages arrive) */
function startRealtime(){if(!sb||!sb.channel||rtCh||!U||!isPro())return;
 try{rtCh=sb.channel('circle-messages-'+U.id).on('postgres_changes',{event:'*',schema:'public',table:'circle_messages'},p=>onMsgEvent(p)).subscribe(st=>{CM.live=st==='SUBSCRIBED';updLive()})}catch(e){rtCh=null}
 clearInterval(msgPoll);msgPoll=setInterval(()=>{if(U&&S&&!document.hidden&&navigator.onLine!==false){const inChat=ui.d&&ui.d.k==='chat';if(inChat||!CM.live||Date.now()%60000<20000)loadMsgs(true)}},20000)}
function stopRealtime(){clearInterval(msgPoll);msgPoll=null;if(rtCh){try{sb.removeChannel(rtCh)}catch(e){}rtCh=null}CM.live=false;CM.msgs=[];CM.loaded=false;CM.err=''}
function onMsgEvent(p){const m=p&&p.new;if(!m||!m.id||!U)return;const i=CM.msgs.findIndex(x=>x.id===m.id);
 if(i>=0)CM.msgs[i]={...CM.msgs[i],...m};else{CM.msgs.push(m);CM.msgs.sort((a,b)=>a.created_at.localeCompare(b.created_at));if(m.sender_id!==U.id&&(p.eventType||'INSERT')==='INSERT')notifyMsg(m)}
 msgRefresh()}
const openChatId=()=>ui.d&&ui.d.k==='chat'?ui.d.id:'';
function notifyMsg(m){const here=m.message_type==='direct'?openChatId()==='dm:'+m.sender_id:openChatId()==='ann:'+m.circle_id;if(here)return;
 toast(m.message_type==='direct'?`🔒 New private message from ${memberName(m.sender_id)}`:`📢 New announcement from ${memberName(m.sender_id)}`)}

 const un=CM.msgs.filter(m=>m.message_type==='direct'&&m.sender_id===x&&m.recipient_id===U.id&&!m.is_read);if(!un.length||markBusy)return;markBusy=true;
 un.forEach(m=>m.is_read=true);try{await sb.from('circle_messages').update({is_read:true}).eq('message_type','direct').eq('recipient_id',U.id).eq('sender_id',x).eq('is_read',false)}catch(e){}markBusy=false;updNav()}

function subChip(){if(SUB.legacy)return '';const e=subEff();
 if(SUB.admin)return `<button class="btn plan adm" data-a="sub" title="Admin — all features">🛡<span class="pl"> Admin</span></button>`;
 return e==='active'?`<button class="btn plan pro" data-a="sub" title="Pro subscription — ${subDays()} days left">⭐ ${subDays()}d</button>`
  :e==='expired'?`<button class="btn plan exp" data-a="sub" title="Subscription expired">⛔<span class="pl"> Expired</span></button>`
  :`<button class="btn plan trl" data-a="sub" title="Free trial">Trial</button>`}
const subPendingNote=()=>SUB.req==='pending'?`<div class="sub-pend">⏳ <b>Pending Verification</b> — UPI ref <b>${esc(SUB.ref)}</b> submitted ${fmtDT(SUB.reqAt)}. Pro is switched on as soon as the payment is verified.</div>`
 :SUB.req==='rejected'?`<div class="sub-rej">✕ <b>Payment not verified</b>${SUB.note?' — '+esc(SUB.note):''}. Please check the UPI reference ID and submit again.</div>`:'';
function subBanner(){if(SUB.legacy||!SUB.loaded)return '';const e=subEff(),onDash=!ui.d&&ui.tab==='dash';let h='';
 if(e==='expired')h=`<div class="sub-ban exp"><div><b>⛔ Subscription Expired — Renew ₹${SUB.price}/month to Continue</b><div>Your farmers, animals, vaccinations and history are safe and still visible. Adding and editing records is paused until you renew.</div>${subPendingNote()}</div><button class="btn pri" data-a="sub">Renew ₹${SUB.price}</button></div>`;
 else if(e==='active'&&!SUB.admin&&subDays()<=5&&(onDash||ui.tab==='circle'))h=`<div class="sub-ban warn"><div><b>⭐ Pro ends in ${subDays()} day${subDays()===1?'':'s'}</b> (${fmtD(SUB.end)}). Renew now — the new 30 days are added after the current end date.${subPendingNote()}</div><button class="btn pri" data-a="sub">Renew</button></div>`;
 else if(e==='trial'&&onDash)h=`<div class="sub-ban trl"><div><b>🧪 Free trial</b> · ${S.cs.length}/${SUB.lim} farmers · ${S.an.length}/${SUB.lim} animals used. <span class="pro-tag">Pro</span> unlocks unlimited records, Inspector Circle, task allotment, circle chat and the full activity log for ₹${SUB.price}/month.${subPendingNote()}</div><button class="btn pri" data-a="sub">Upgrade ₹${SUB.price}/month</button></div>`;
 if(SUB.admin&&onDash){const n=ADM.rows.filter(r=>r.pending_payment_id).length;if(n)h+=`<div class="sub-ban adm" data-a="admin"><div><b>🛡 ${n} payment request${n>1?'s':''} waiting for verification</b><div>Open the Subscription Manager to check the UPI reference IDs and activate.</div></div><button class="btn pri" data-a="admin">Open</button></div>`}
 return h}
function subLock(kind,feat){const exp=kind==='exp'||subEff()==='expired';popOpen=false;
 sheet(exp?'⛔ Subscription expired':'🔒 Pro feature',`<div class="lock-hero${exp?' exp':''}"><div class="lk">${exp?'⛔':'🔒'}</div>
 <b>${exp?`Subscription Expired — Renew ₹${SUB.price}/month to Continue`:`Pro Feature — Upgrade for ₹${SUB.price}/month`}</b>
 ${!exp&&feat?`<div class="mut">${esc(feat)} is included in Pro.</div>`:''}
 <div class="mut">${exp?'All your farmers, animals, vaccinations, AI / PD, feed and payment records are safely stored and still visible. Adding and editing is paused until you renew — everything continues exactly where you left off.':`Pro unlocks unlimited farmers &amp; animals (trial: ${SUB.lim} each), Inspector Circle with task allotment, circle chat (1-on-1 and announcements) and the full activity log.`}</div></div>
 ${subPendingNote()}<div class="btns" style="justify-content:center"><button class="btn pri" data-a="sub">${exp?'Renew':'Upgrade'} ₹${SUB.price}/month</button></div>`)}
function circleLocked(){const exp=subEff()==='expired';
 return `<h2 style="margin-top:0">👥 Inspector Circle</h2><div class="card lock-hero${exp?' exp':''}"><div class="lk">🔒</div><b>${exp?`Subscription Expired — Renew ₹${SUB.price}/month to Continue`:`Pro Feature — Upgrade for ₹${SUB.price}/month`}</b>
 <ul class="lock-list"><li>Create or join a circle of fellow inspectors with an invite code</li><li>Allot follow-ups and visits to a colleague — Accept / Decline / Close with description</li><li>Closed tasks return to you to set the next follow-up in your Tracker</li><li>🔒 Private 1-on-1 chat and 📢 circle announcements</li></ul>
 ${exp?'<div class="mut">Your earlier circle tasks and messages are kept and come back after renewal.</div>':''}${subPendingNote()}

/* Subscription / upgrade sheet */
const upiLink=()=>`upi://pay?pa=${encodeURIComponent(SUB.upi).replace(/%40/g,'@')}&pn=${encodeURIComponent(SUB.payee||'Livestock Inspector App')}&am=${SUB.price}.00&cu=INR&tn=${encodeURIComponent('Pro '+SUB.days+' days '+(U.phone||U.email||''))}`;
/* one button per UPI app: on iPhone a plain upi:// link opens WhatsApp only, so each app gets its own link
   (iPhone: the app's own scheme; Android: an intent for that app). Android also gets "Other UPI app" (system chooser). */
const UPIAPPS=[['Google Pay','tez://upi/pay','com.google.android.apps.nbu.paisa.user','#1a73e8'],['PhonePe','phonepe://pay','com.phonepe.app','#5f259f'],['Paytm','paytmmp://pay','net.one97.paytm','#00b9f1'],['BHIM','bhim://upi/pay','in.org.npci.upiapp','#f37021'],['CRED','credpay://upi/pay','com.dreamplug.androidapp','#111827'],['Amazon Pay','amazonpay://upi/pay','in.amazon.mShop.android.shopping','#ff9900']];
const upiQ=()=>upiLink().split('?')[1];
const upiAppHref=a=>isIOS()?`${a[1]}?${upiQ()}`:`intent://pay?${upiQ()}#Intent;scheme=upi;package=${a[2]};end`;
function upiButtons(){if(!SUB.upi||!isMobile())return '';
 return `<div class="upi-apps"><div class="mut" style="font-size:13px;margin-bottom:6px">Tap your UPI app to pay ₹${SUB.price}:</div><div class="upi-grid">${UPIAPPS.map(a=>`<a class="upi-app" style="--c:${a[3]}" href="${esc(upiAppHref(a))}">${a[0]}</a>`).join('')}${isIOS()?'':`<a class="upi-app other" href="${esc(upiLink())}">Other UPI app</a>`}</div>
 <div class="mut" style="font-size:12px;margin-top:6px">If the app is not installed or shows a warning, scan the QR code or pay to the UPI ID manually.</div></div>`}
async function subPays(){if(!sb||!U||SUB.legacy)return;
 try{const{data,error}=await sb.from('subscription_payments').select('id,upi_ref_id,provider,amount,days,status,submitted_at,reviewed_at,review_note,period_end').eq('user_id',U.id).order('submitted_at',{ascending:false}).limit(10);if(!error)SUB.pays=data||[]}catch(e){}
 if(SUB.hasQr&&!SUB.qr){try{const{data}=await sb.from('app_settings').select('upi_qr').eq('id',1).maybeSingle();SUB.qr=(data&&data.upi_qr)||''}catch(e){}}}
async function subOpen(){subView();await loadSub(true);await subPays();if($('#subv'))subView()}
function subView(){const e=subEff(),P=SUB.price,pend=SUB.req==='pending';
 const tick='<span class="yes">✓</span>',lock='<span class="no">🔒</span>';
 const st=SUB.legacy?`<div class="card note">The subscription system is not switched on yet (run <b>supabase-subscriptions.sql</b> in Supabase). All features are open.</div>`
  :SUB.admin?`<div class="plan-card adm"><b>🛡 Admin account</b><div>All features are always unlocked for you.</div></div>`
  :e==='active'?`<div class="plan-card pro"><b>⭐ Pro — Active</b><div class="big">${subDays()} day${subDays()===1?'':'s'} left</div><div>Started ${fmtD(SUB.start)} · ends <b>${fmtD(SUB.end)}</b></div></div>`
  :e==='expired'?`<div class="plan-card exp"><b>⛔ Subscription Expired</b><div>${SUB.end?'Ended '+fmtD(SUB.end)+'. ':''}Renew ₹${P}/month to continue. All your records are safe and still visible.</div></div>`
  :`<div class="plan-card trl"><b>🧪 Free trial</b><div>${S.cs.length}/${SUB.lim} farmers · ${S.an.length}/${SUB.lim} animals used. Upgrade to Pro for everything.</div></div>`;
 const rows=[['Farmers &amp; animals',`${SUB.lim} each`,'Unlimited'],['Vaccinations, AI, PD, feed, payments',tick,tick],['1-day reminders · Snooze / Stop',tick,tick],['Mark as Aborted · history timeline',tick,tick],['Inspector Circle &amp; task allotment',lock,tick],['Circle chat (1-on-1 + announcements)',lock,tick],['Activity log',`Last ${LOGFREE}`,'Full'],['Price','Free',`₹${P} / ${SUB.days} days`]];
 const cmp=`<table class="cmp"><tr><th></th><th>Trial</th><th>Pro</th></tr>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`;
 const pay=SUB.legacy||SUB.admin?'':`<h4 style="margin:14px 0 6px">${e==='active'?'Renew / extend':e==='expired'?'Renew':'Upgrade'} — ₹${P} for ${SUB.days} days by UPI</h4>
 <div class="pay-box"><div class="qr">${SUB.qr?`<img src="${esc(SUB.qr)}" alt="UPI QR code for payment">`:`<div class="qr-ph">UPI QR<small>${SUB.hasQr?'loading…':'QR not added yet — pay to the UPI ID'}</small></div>`}</div>
  <div class="pay-info"><div class="mut">UPI ID</div><div class="upi">${SUB.upi?esc(SUB.upi):'<span class="mut">Not set yet by the app owner</span>'}</div>${SUB.upi?'<button class="btn sm" data-a="subCopy">📋 Copy UPI ID</button>':''}
  ${SUB.payee?`<div class="mut" style="margin-top:6px">Payee: <b>${esc(SUB.payee)}</b></div>`:''}<div class="amt">₹${P}</div></div></div>${upiButtons()}
 <ol class="steps"><li>Pay <b>₹${P}</b> to the UPI ID / QR above from any UPI app (GPay, PhonePe, Paytm, BHIM…).</li><li>Open the payment receipt and copy the <b>UPI transaction / reference ID</b> (12-digit UTR).</li><li>Paste it below and submit. Your request is marked <b>Pending Verification</b>; Pro starts as soon as the payment is verified.</li></ol>
 ${subPendingNote()}
 <label>UPI Transaction / Reference ID *<input id="subRef" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="40" placeholder="e.g. 412345678901" value="${pend?esc(SUB.ref):''}"></label><p class="err" id="subErr"></p>
 <div class="btns" style="margin-top:0"><button class="btn pri" data-a="subReq">${pend?'Update reference ID':'Submit for verification'}</button></div>`;
 const hist=SUB.pays.length?`<details style="margin-top:12px"><summary class="mut" style="cursor:pointer">Payment history (${SUB.pays.length})</summary>${SUB.pays.map(p=>`<div class="pay-row"><div><b>₹${p.amount}</b> · ${p.provider==='upi_manual'?'UPI ref '+esc(p.upi_ref_id||''):esc(p.provider)} <div class="mut">${fmtDT(p.submitted_at)}${p.period_end?' · Pro until '+fmtD(p.period_end):''}${p.review_note?' · '+esc(p.review_note):''}</div></div>${b(p.status==='approved'?'Verified':p.status==='rejected'?'Not verified':'Pending',p.status==='approved'?'ok':p.status==='rejected'?'bad':'wn')}</div>`).join('')}</details>`:'';
 sheet('⭐ Subscription',`<div id="subv">${st}${SUB.err==='offline'?'<p class="mut" style="font-size:13px">⚠️ Offline — showing the last known plan.</p>':''}${cmp}${pay}${hist}
 ${SUB.admin?'<div class="btns"><button class="btn pri" data-a="admin">🛡 Open Subscription Manager</button></div>':'<p class="mut" style="font-size:13px;margin-top:12px">Problem with payment or activation? <a href="#" data-a="supOpen" style="color:var(--pri);font-weight:700">🛟 Chat with Support</a></p>'}</div>`)}
async function subReq(){const i=$('#subRef'),el=$('#subErr');if(!i||!el)return;const v=i.value.replace(/[\s-]/g,'').toUpperCase();
 if(!/^[A-Z0-9]{6,35}$/.test(v)){el.textContent='Enter the UPI transaction / reference ID (UTR) from your payment receipt — 6 to 35 letters or digits.';return}
 el.textContent='Submitting…';const{data,error}=await sb.rpc('request_subscription',{p_upi_ref:v});
 if(error){el.textContent=/already been submitted/i.test(error.message)?'This UPI reference ID has already been submitted.':String(error.message||'Could not submit. Check the internet connection.').replace(/^ERROR:\s*/,'');return}
 subApply(data);try{localStorage.setItem(subKey(),JSON.stringify(data))}catch(e){}toast('⏳ Submitted — Pending Verification');await subPays();subView();softRender()}

/* ---------- Admin: Subscription Manager (only for accounts in app_admins; checked again by the database) ---------- */
const ADM={rows:[],loaded:false,busy:false,err:'',f:'pending',q:'',view:'subs'};
async function loadAdmin(){if(!sb||!SUB.admin||ADM.busy)return;ADM.busy=true;
 try{const{data,error}=await sb.rpc('admin_overview');if(error)throw error;ADM.rows=data||[];ADM.loaded=true;ADM.err=''}
 catch(e){ADM.err=String(e&&e.message||e)}finally{ADM.busy=false}
 if(!U)return;if(ui.tab==='admin'&&!ui.d){const l=$('#admList');if(l&&!$('#m').hidden)l.innerHTML=adminList();else softRender()}else if(ui.tab==='dash'&&!ui.d)softRender()}
const admCount=k=>ADM.rows.filter(r=>k==='pending'?r.pending_payment_id:k==='all'?1:r.subscription_status===k).length;
function adminView(){if(!SUB.admin)return `<div class="card note">This page is only for the app owner.</div>`;
 const tabs=`<div class="adm-tabs">${[['subs','⭐ Subscriptions'],['users','👥 Users'+(ADU.loaded?' ('+ADU.rows.length+')':'')],['support','🛟 Support']].map(([k,l])=>`<button class="chip ${ADM.view===k?'on':''}" data-a="admV" data-id="${k}">${l}${k==='support'?' '+cntB(supCount()):''}</button>`).join('')}</div>`;
 return tabs+(ADM.view==='users'?usersView():ADM.view==='support'?supInboxView():subsView())}
async function admSto(){const el=$('#admSto');if(!el||!sb)return;try{const{data,error}=await sb.rpc('admin_tag_photo_usage');if(error)throw error;const d=data||{},top=(d.top||[]).slice(0,5);
 el.innerHTML=`<b>📷 Tag photo storage</b> · ${+d.files||0} photos · ${esc(kbTxt(+d.bytes||0))} · ${+d.users||0} inspector${d.users===1?'':'s'}<div class="mut">Average ${esc(kbTxt(d.files?(+d.bytes/ +d.files):0))} per photo. Supabase Free plan includes 1 GB of Storage (≈ ${d.files?Math.floor(1073741824/(+d.bytes/ +d.files)).toLocaleString('en-IN'):'5,000+'} photos at this size); Pro includes 100 GB. Counts only — photos stay private to each inspector.</div>${top.length?`<div class="mut" style="margin-top:4px">Largest: ${top.map(r=>esc(r.name||'inspector')+' '+esc(kbTxt(+r.bytes||0))).join(' · ')}</div>`:''}`}
 catch(e){el.innerHTML='📷 Tag photo storage: <span class="mut">run supabase-tag-photos.sql to see usage.</span>'}}
function subsView(){setTimeout(admSto,0);
 const ch=(k,l)=>`<button class="chip ${ADM.f===k?'on':''}" data-a="admF" data-id="${k}">${l} (${admCount(k)})</button>`;
 return `<div class="between"><h2 style="margin:0">🛡 Subscription Manager</h2><button class="btn sm" data-a="tab" data-id="dash" style="margin:0">← Home</button></div>
 <p class="mut" style="margin:6px 0 10px;font-size:13px">Verify ₹${SUB.price} UPI payments and switch inspectors to Pro. You see only contact and plan details — never an inspector's farmers, animals, clinical or payment records.</p>
 <div class="grid adm-stats"><div class="card stat"><small>Pending</small><b>${admCount('pending')}</b></div><div class="card stat"><small>Active Pro</small><b>${admCount('active')}</b></div><div class="card stat"><small>Trial</small><b>${admCount('trial')}</b></div><div class="card stat"><small>Expired</small><b>${admCount('expired')}</b></div></div>
 <div class="card" id="admSto" style="font-size:13px;padding:10px 12px">📷 Tag photo storage: loading…</div><div class="btns"><button class="btn" data-a="admRef">↻ Refresh</button><button class="btn" data-a="admSet">⚙ Payment settings (UPI ID &amp; QR)</button></div>
 ${!SUB.upi?'<div class="card note" style="margin-top:10px">⚠️ Add your UPI ID and QR code in <b>Payment settings</b> so inspectors can pay.</div>':''}
 <div class="chips">${ch('pending','⏳ Pending')}${ch('active','⭐ Active')}${ch('trial','🧪 Trial')}${ch('expired','⛔ Expired')}${ch('all','All')}</div>
 <div class="chips"><input id="admq" placeholder="Search name, email, phone, UPI ref…" value="${esc(ADM.q)}"></div>
 <div id="admList">${adminList()}</div>`}
function adminList(){if(ADM.err)return `<div class="card note">⚠️ ${esc(ADM.err)}</div>`;if(!ADM.loaded)return '<div class="empty">Loading…</div>';
 const q=ADM.q.toLowerCase(),L=ADM.rows.filter(r=>(ADM.f==='all'||(ADM.f==='pending'?r.pending_payment_id:r.subscription_status===ADM.f))&&(!q||[r.full_name,r.email,r.phone,r.hospital,r.area,r.pending_ref,r.upi_ref_id].join(' ').toLowerCase().includes(q)));
 if(!L.length)return emptyBox('🛡',ADM.f==='pending'?'No payment requests waiting.':'Nobody here.',ADM.f==='pending'?'New ₹'+SUB.price+' requests appear here with their UPI reference ID.':'Try another filter or search.');
 return L.map(r=>{const s=r.subscription_status,stB=s==='active'?b('⭐ Pro','ok'):s==='expired'?b('⛔ Expired','bad'):b('🧪 Trial','wn');
  return `<div class="card adm-row${r.pending_payment_id?' pend':''}"><div class="between" style="align-items:flex-start"><div style="min-width:0"><b>${esc(r.full_name||'(no name)')}</b>${r.is_admin?' '+b('Admin'):''}<div class="mut">${esc([r.hospital,r.area].filter(Boolean).join(' · '))}</div><div class="mut">${esc(r.email||'')}${r.phone?' · '+esc(r.phone):''}</div></div><div class="end">${stB}${s==='active'?`<div class="mut" style="font-size:12px">until ${fmtD(r.subscription_end)}<br>${r.days_left} day${r.days_left===1?'':'s'} left</div>`:r.subscription_end?`<div class="mut" style="font-size:12px">ended ${fmtD(r.subscription_end)}</div>`:''}</div></div>
  ${r.pending_payment_id?`<div class="adm-pay">⏳ <b>₹${r.pending_amount}</b> · UPI ref <b class="ref">${esc(r.pending_ref)}</b><div class="mut">Submitted ${fmtDT(r.pending_at)}</div><div class="btns"><button class="btn pri" data-a="admAct" data-id="${r.user_id}|${r.pending_payment_id}">✅ Activate ${SUB.days} Days</button><button class="btn dng" data-a="admRej" data-id="${r.pending_payment_id}">✕ Reject</button></div></div>`:''}
  ${r.request_status==='rejected'&&!r.pending_payment_id?`<div class="mut" style="font-size:13px">Last request not verified${r.review_note?': '+esc(r.review_note):''}</div>`:''}
  <div class="btns"><button class="btn sm" data-a="admExt" data-id="${r.user_id}">+${SUB.days} days</button><button class="btn sm" data-a="admCus" data-id="${r.user_id}">Extend…</button>${s==='active'&&!r.is_admin?`<button class="btn sm dng" data-a="admRev" data-id="${r.user_id}">Revoke</button>`:''}</div></div>`}).join('')}
const admName=id=>{const r=ADM.rows.find(x=>x.user_id===id);return r?(r.full_name||r.email||'this inspector'):'this inspector'};
async function admRpc(fn,args,ok){const{error}=await sb.rpc(fn,args);if(error){toast('⚠️ '+String(error.message||error).replace(/^ERROR:\s*/,''));return false}toast(ok);await loadAdmin();if(ADM.view==='users')loadDir();if(args.p_user===U.id)loadSub(true);return true}

function admReject(pid){const r=ADM.rows.find(x=>x.pending_payment_id===pid);modal('Reject payment request',`<p style="margin-top:0">${esc(r?r.full_name||r.email:'')} · UPI ref <b>${esc(r?r.pending_ref:'')}</b></p>${ta('Reason shown to the inspector (optional)','note','')}<div class="chips">${['UPI reference ID not found','Amount does not match','Duplicate request'].map(x=>`<button type="button" class="chip" data-rr="${esc(x)}">${esc(x)}</button>`).join('')}</div><p class="err"></p>`,()=>{},f=>{f.querySelectorAll('[data-rr]').forEach(x=>x.onclick=()=>{f.note.value=x.dataset.rr});f.onsubmit=async e=>{e.preventDefault();f.querySelector('.err').textContent='Saving…';if(await admRpc('admin_reject_payment',{p_payment_id:pid,p_note:f.note.value.trim()},'Request marked not verified'))closeM()}})}
function admRevoke(uid){modal(`Revoke Pro · ${esc(admName(uid))}`,`<p style="margin-top:0">Pro ends now and the account becomes <b>Expired</b>. <b>No records are deleted</b> — the inspector keeps seeing everything and continues after renewal.</p>${ta('Note (optional)','note','')}<p class="err"></p>`,()=>{},f=>{f.onsubmit=async e=>{e.preventDefault();f.querySelector('.err').textContent='Saving…';if(await admRpc('admin_revoke',{p_user:uid,p_note:f.note.value.trim()},'Pro revoked'))closeM()}})}
/* owner's UPI details + QR image (stored in app_settings; the image is resized on the device before upload) */

  f.qrf.onchange=()=>{const file=f.qrf.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const m=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);qr=c.toDataURL('image/png');if(qr.length>380000)qr=c.toDataURL('image/jpeg',.85);$('#qrp').innerHTML=`<img src="${qr}" alt="QR preview">`};im.onerror=()=>{f.querySelector('.err').textContent='That file is not an image.'};im.src=rd.result};rd.readAsDataURL(file)};
  f.onsubmit=async e=>{e.preventDefault();const el=f.querySelector('.err'),upi=f.upi.value.trim();if(!/^[\w.\-]{2,}@[a-zA-Z][\w.\-]{1,}$/.test(upi))return el.textContent='Enter a valid UPI ID, e.g. name@okaxis';
   if(f.qrdel&&f.qrdel.checked)qr='';const row={upi_id:upi,payee_name:f.payee.value.trim(),upi_qr:qr};

   if(error)return el.textContent=String(error.message||error);SUB.upi=upi;SUB.payee=row.payee_name;SUB.hasQr=!!qr;SUB.qr=qr;if(supOk){SUP.email=row.support_email;SUP.phone=row.support_phone;SUP.cfg=true}closeM();toast('Settings saved');loadSub(true);render()}})}

/* ---------- Help & Support (one private thread per inspector with the admin) + Admin user directory ----------
   Tables: support_messages (inspector ↔ admin), view user_profiles, functions admin_user_directory / admin_support_threads.
   Row security in Supabase: an inspector reads and writes only their own thread; only app_admins see every thread
   and the user directory. Passwords are never read or shown (they stay inside Supabase Auth). */
const SUP0=()=>({thread:'',msgs:[],loaded:false,busy:false,err:'',unread:0,live:false,email:'',phone:'',cfg:false,seen:0});
const SUP=SUP0();let supCh=null,supPoll=null;
const ADU={rows:[],loaded:false,busy:false,err:'',q:'',f:'all'};
const ADT={rows:[],loaded:false,busy:false,err:'',q:'',f:'all',seen:0};
const supErr=e=>/support_messages|user_profiles|admin_user_directory|admin_support_threads|support_mark_read|support_email|support_phone|mark_seen|42P01|42703|42883|PGRST20[025]|schema cache|does not exist/i.test(String(e&&(e.message||e.code)||e))?'setup':'';
const digits=x=>String(x||'').replace(/\D/g,'');
const telHref=p=>{const d=digits(p);return d?'tel:'+(d.length===10?'+91'+d:'+'+d):''};
const waHref=p=>{const d=digits(p);return d?'https://wa.me/'+(d.length===10?'91'+d:d):''};
const fmtPhone=p=>{const d=digits(p);return d.length===10?d.slice(0,5)+' '+d.slice(5):String(p||'')};
const ago=x=>{if(!x)return 'never';const m=Math.round((Date.now()-Date.parse(x))/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' day'+(Math.round(m/1440)===1?'':'s')+' ago'};
const isOnline=x=>!!x&&Date.now()-Date.parse(x)<6*60000;
const supCount=()=>SUB.admin?ADT.rows.reduce((a,r)=>a+(+r.unread||0),0):SUP.unread;
const cntB=(n,extra='')=>`<i class="cnt supN ${extra}"${n?'':' hidden'}>${n||0}</i>`;
function supBadges(){const n=supCount();document.querySelectorAll('.supN').forEach(e=>{e.textContent=n;e.hidden=!n})}
/* one-tap contact buttons: call (tel:), WhatsApp, email (mailto:) and copy */
const contactBtns=(ph,em)=>`${digits(ph)?`<a class="btn sm call" href="${telHref(ph)}">📞 Call ${esc(fmtPhone(ph))}</a><button class="btn sm" data-a="cpy" data-id="${esc(digits(ph))}" title="Copy number">📋 Copy</button><a class="btn sm wa" href="${waHref(ph)}" target="_blank" rel="noopener">WhatsApp</a>`:''}${em?`<a class="btn sm mail" href="mailto:${esc(em)}">✉️ ${esc(em)}</a><button class="btn sm" data-a="cpy" data-id="${esc(em)}" title="Copy email">📋 Copy</button>`:''}`;
const markSeen=()=>{if(sb&&U)sb.rpc('mark_seen').then(()=>{},()=>{})};
setInterval(()=>{if(U&&S&&!document.hidden&&navigator.onLine!==false)markSeen()},4*60000);

async function supCfg(){if(!sb||!U)return;try{const{data,error}=await sb.from('app_settings').select('support_email,support_phone').eq('id',1).maybeSingle();if(error)throw error;SUP.email=(data&&data.support_email)||'';SUP.phone=(data&&data.support_phone)||'';SUP.cfg=true}catch(e){if(supErr(e))SUP.err='setup'}}
async function supLoad(uid,quiet){if(!sb||!U||SUP.busy)return;uid=uid||U.id;SUP.busy=true;
 try{const{data,error}=await sb.from('support_messages').select('*').eq('user_id',uid).order('created_at',{ascending:true}).limit(500);if(error)throw error;
  if(SUP.thread===uid||!SUP.thread){SUP.thread=uid;SUP.msgs=data||[];SUP.loaded=true;SUP.err=''}}
 catch(e){SUP.err=supErr(e)||String(e&&e.message||e);if(!quiet)toast('⚠️ '+(SUP.err==='setup'?'Support chat is not set up yet':'Could not load messages'))}finally{SUP.busy=false}
 if(ui.d&&ui.d.k==='sup'&&SUP.err==='setup')softRender();else supPaint()}
async function supUnread(){if(!sb||!U||SUP.err==='setup')return;
 if(SUB.admin)return loadThreads(true);
 try{const{data,error}=await sb.from('support_messages').select('id,sender_role,read_by_user_at').eq('user_id',U.id).eq('sender_role','admin');if(error)throw error;
  const n=(data||[]).filter(m=>!m.read_by_user_at).length;if(SUP.seen&&n>SUP.unread&&!(ui.d&&ui.d.k==='sup'))toast('🛟 Support replied — open Help & Support');SUP.unread=n;SUP.seen=1}
 catch(e){if(supErr(e))SUP.err='setup'}supBadges()}
async function supRead(uid){const mine=uid===U.id;const L=SUP.msgs.filter(m=>mine?(m.sender_role==='admin'&&!m.read_by_user_at):(m.sender_role==='user'&&!m.read_by_admin_at));if(!L.length)return;
 const now=new Date().toISOString();L.forEach(m=>{if(mine)m.read_by_user_at=now;else m.read_by_admin_at=now});
 if(mine)SUP.unread=0;else{const r=ADT.rows.find(x=>x.user_id===uid);if(r)r.unread=0;const d=ADU.rows.find(x=>x.user_id===uid);if(d)d.support_unread=0}
 supBadges();try{await sb.rpc('support_mark_read',{p_user:mine?null:uid})}catch(e){}}
function supPaint(){const open=ui.d&&ui.d.k==='sup'?ui.d.id:'';
 if(open&&open===SUP.thread){const L=$('#supList');if(L){const atEnd=scrollY+innerHeight>=document.documentElement.scrollHeight-160;L.innerHTML=supBubbles();if(atEnd)scrollTo(0,document.documentElement.scrollHeight)}const dt=$('#supLive');if(dt)dt.className='live '+(SUP.live?'on':'off');if(!document.hidden)supRead(open)}

/* live updates (Realtime respects the row security) + a 30-second check as backup */
function supStart(){if(!sb||!U||SUP.err==='setup')return;
 if(!supCh&&sb.channel)try{const f={event:'*',schema:'public',table:'support_messages'};if(!SUB.admin)f.filter='user_id=eq.'+U.id;
  supCh=sb.channel('support-'+U.id).on('postgres_changes',f,p=>onSupEvent(p)).subscribe(st=>{SUP.live=st==='SUBSCRIBED';const dt=$('#supLive');if(dt)dt.className='live '+(SUP.live?'on':'off')})}catch(e){supCh=null}
 clearInterval(supPoll);supPoll=setInterval(()=>{if(!U||!S||document.hidden||navigator.onLine===false)return;if(ui.d&&ui.d.k==='sup')supLoad(ui.d.id,true);else if(!SUP.live||Date.now()%120000<30000)supUnread()},30000)}
function supStop(){clearInterval(supPoll);supPoll=null;if(supCh){try{sb.removeChannel(supCh)}catch(e){}supCh=null}}
function onSupEvent(p){const m=p&&p.new;if(!m||!m.id||!U)return;const ins=(p.eventType||'INSERT')==='INSERT';
 if(m.user_id===SUP.thread){const i=SUP.msgs.findIndex(x=>x.id===m.id);if(i>=0)SUP.msgs[i]={...SUP.msgs[i],...m};else if(ins){SUP.msgs.push(m);SUP.msgs.sort((a,b)=>a.created_at.localeCompare(b.created_at))}}
 const open=ui.d&&ui.d.k==='sup'&&ui.d.id===m.user_id;
 if(ins&&m.sender_id!==U.id&&!open){if(SUB.admin&&m.sender_role==='user'){toast('🛟 New support message');loadThreads()}else if(!SUB.admin&&m.sender_role==='admin'){SUP.unread++;toast('🛟 Support replied — open Help & Support')}}
 supPaint()}

/* Support page: inspector → own thread with the admin; admin → any inspector's thread */
function supOpen(uid){uid=uid||U.id;if(uid!==U.id&&!SUB.admin)return;closeM();if(SUP.thread!==uid){SUP.msgs=[];SUP.loaded=false}SUP.thread=uid;open('sup',uid);render();setTimeout(()=>scrollTo(0,document.documentElement.scrollHeight),60);

/* ---------- installable mobile app (PWA) ---------- */
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMobile=()=>isIOS()||/android|mobile/i.test(navigator.userAgent);
const IK='lvi_install_hide';let deferredPrompt=null;
const instSnoozed=()=>{try{return +localStorage.getItem(IK)>Date.now()}catch(e){return false}};
const shareIc='<svg class="shr" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
function showInstall(){const el=$('#inst');if(!el||isStandalone()||instSnoozed())return;
 if(deferredPrompt)el.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="inst-tx"><b>Install Field Officer</b>Open it from your home screen like an app. Starts fast and opens offline.</div><div class="inst-bt"><button class="btn pri sm" data-a="instGo">Install</button><button class="btn sm" data-a="instNo" aria-label="Not now">✕</button></div>`;
 else if(isIOS())el.innerHTML=`<img src="icons/icon-192.png" alt=""><div class="inst-tx"><b>Add to Home Screen</b>Tap ${shareIc} <b style="display:inline;font-size:13px">Share</b>, then <b style="display:inline;font-size:13px">“Add to Home Screen”</b>.</div><div class="inst-bt"><button class="btn sm" data-a="instNo" aria-label="Close">✕</button></div>`;
 else return;el.hidden=false}
function installHelp(){const ios=isIOS();sheet('📲 Install the app',ios?`<ol style="padding-left:20px;line-height:1.8"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button ${shareIc} at the bottom (or top) of the screen.</li><li>Scroll down and tap <b>“Add to Home Screen”</b>, then <b>Add</b>.</li></ol><p class="mut">The Field Officer icon appears on your home screen and opens full-screen like an app.</p>`
 :`<ol style="padding-left:20px;line-height:1.8"><li>Open this page in <b>Chrome</b> (or Edge / Samsung Internet).</li><li>Tap the menu <b>⋮</b> at the top right.</li><li>Tap <b>“Install app”</b> or <b>“Add to Home screen”</b>, then <b>Install</b>.</li></ol><p class="mut">The Field Officer icon appears on your home screen and opens full-screen like an app.</p>`)}
async function doInstall(){if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;$('#inst').hidden=true;closeM();try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==='accepted')toast('Installing Field Officer…')}catch(e){}return}installHelp()}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;setTimeout(showInstall,1500)});
addEventListener('appinstalled',()=>{deferredPrompt=null;const el=$('#inst');if(el)el.hidden=true;toast('✅ App installed. Open it from your home screen.')});
/* iPhone / iPad have no install prompt: show the short guide once the page has settled */
if(isIOS()&&!isStandalone())setTimeout(showInstall,3000);
/* home-screen shortcuts: ?go=qT (vaccination), qAI, qPD, qFD */
function runShortcut(){const q=new URLSearchParams(location.search),go=q.get('go');if(!go||!['qT','qAI','qPD','qFD'].includes(go))return;
 q.delete('go');history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:'')+location.hash);setTimeout(()=>act(go),350)}
/* service worker: fast start + offline opening (Supabase sign-in and data requests are never cached) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))
 addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(reg=>setInterval(()=>reg.update().catch(()=>{}),3600000)).catch(e=>console.warn('Service worker not registered:',e)));

/* ---------- start: wait for Supabase to report the saved session ---------- */
ui.auth=sb?'loading':'login';render();
if(sb){let first=true;
 sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
  if(ev==='PASSWORD_RECOVERY'){U=null;S=null;ui.auth='newpw';ui.note='';return render()}
  if(ev==='SIGNED_OUT')return endSession();
  if(session&&session.user&&ui.auth!=='newpw'){if(!U||U.id!==session.user.id)startSession(session.user)}
  else if(first&&!session){ui.auth='login';render()}
  first=false},0)})}
</script>
</body>
</html>
